<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLV Materials Pricelist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .modal { transition: opacity 0.2s ease-in-out; opacity: 0; pointer-events: none; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.98); transition: transform 0.2s ease-in-out; }
        .modal.active .modal-content { transform: scale(1); }
        .selected-row { background-color: #f0f7ff !important; }
        
        .price-grid { display: grid; grid-template-columns: 12px 1fr 35px; align-items: baseline; gap: 1px; width: 100%; max-width: 140px; margin-left: auto; }
        .price-number { text-align: right; font-variant-numeric: tabular-nums; }

        /* Announcement Board Enhancements */
        #boardContent { white-space: pre-wrap; word-break: break-word; }
        
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .animate-pulse-soft { animation: pulse-soft 2s infinite ease-in-out; }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }
        .shine-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-25deg);
            animation: shine 6s infinite ease-in-out;
        }

        .overflow-x-auto { -webkit-overflow-scrolling: touch; }
        .overflow-x-auto::-webkit-scrollbar { height: 4px; }
        .overflow-x-auto::-webkit-scrollbar-track { background: #f1f1f1; }
        .overflow-x-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        tr { transform: translateZ(0); }

        @media print { 
            .no-print { display: none !important; } 
            #tableContainer { box-shadow: none; border: none; width: 100%; } 
            body { background-color: white; } 
            main { padding: 0; max-width: 100%; }
            #messageBoard { border: 1px solid #e2e8f0; color: black !important; background: white !important; box-shadow: none; margin-bottom: 20px; }
            #messageBoard * { color: black !important; }
            body.selection-active-print tr:not(.selected-row):not(.header-row) { display: none !important; }
            .selected-row { background-color: transparent !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg text-white"><i data-lucide="package" class="w-5 h-5"></i></div>
                <h1 class="text-sm sm:text-lg font-bold uppercase tracking-tight">DLV Materials Pricelist</h1>
            </div>
            
            <div class="flex items-center gap-1 sm:gap-3">
                <button onclick="refreshData()" class="p-2 text-slate-500 hover:text-blue-600 transition" title="Refresh Data">
                    <i data-lucide="refresh-cw" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </button>
                <button id="selectionToggle" onclick="toggleSelectionMode()" class="p-2 sm:px-3 sm:py-2 text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200 transition">
                    <i data-lucide="check-square" class="w-4 h-4 sm:hidden"></i>
                    <span id="selectionLabel" class="hidden sm:inline uppercase text-[10px] font-black">Selection Mode</span>
                </button>
                <button onclick="handlePrint()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200" title="Print List">
                    <i data-lucide="printer" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </button>

                <div id="adminControls" class="hidden flex items-center gap-1 sm:gap-3 border-l border-slate-200 pl-2 sm:pl-3">
                    <input type="file" id="excelInput" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
                    <button onclick="document.getElementById('excelInput').click()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200 transition">
                        <i data-lucide="file-up" class="w-4 h-4"></i><span class="hidden lg:inline uppercase text-[10px] font-black">Import</span>
                    </button>
                    <button onclick="openModal('itemModal', 'add')" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-blue-700 transition">Add</button>
                    <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-500 transition"><i data-lucide="log-out" class="w-4 h-4 sm:w-5 sm:h-5"></i></button>
                </div>
                <button id="loginBtn" onclick="openModal('loginModal')" class="text-[10px] font-black uppercase text-slate-400 hover:text-blue-600 px-2 transition-colors">Admin</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 sm:py-8">
        <!-- Enhanced Announcement Board -->
        <div id="messageBoard" class="mb-6 bg-gradient-to-br from-indigo-600 via-blue-600 to-blue-700 rounded-2xl p-5 sm:p-7 shadow-xl text-white relative overflow-hidden shine-effect">
            <div class="absolute -top-6 -right-6 opacity-10">
                <i data-lucide="megaphone" class="w-32 h-32 rotate-12"></i>
            </div>
            <div class="relative z-10">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2 animate-pulse-soft">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-yellow-500"></span>
                        </span>
                        <span class="text-[10px] font-black uppercase tracking-widest bg-yellow-500 text-blue-900 px-2.5 py-1 rounded-full shadow-sm">Attention Required</span>
                    </div>
                    <button id="editMessageBtn" onclick="openModal('messageModal')" class="hidden bg-white/20 hover:bg-white/30 p-2 rounded-xl transition no-print backdrop-blur-md">
                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                    </button>
                </div>
                <h2 id="boardTitle" class="text-xl sm:text-2xl font-black uppercase mb-2 tracking-tight drop-shadow-md">Latest Updates</h2>
                <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/10 shadow-inner">
                    <p id="boardContent" class="text-sm sm:text-base text-white font-semibold leading-relaxed">Loading message...</p>
                </div>
                <div id="boardDate" class="mt-4 text-[10px] font-bold uppercase tracking-widest opacity-80 flex items-center gap-2">
                    <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                    <span>Updated: --</span>
                </div>
            </div>
        </div>

        <div id="selectionInfo" class="hidden no-print mb-4 p-3 bg-blue-50 border border-blue-100 rounded-lg flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="info" class="w-4 h-4 text-blue-600"></i>
                <p class="text-[10px] text-blue-700 font-bold uppercase"><span id="selectedCount">0</span> items selected for printing</p>
            </div>
            <button onclick="clearSelection()" class="text-[10px] text-blue-600 font-black uppercase hover:underline">Clear Selection</button>
        </div>

        <div class="mb-4 no-print">
            <div class="relative w-full">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="SEARCH MATERIALS OR #ID..." class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl outline-none text-sm uppercase shadow-sm focus:border-blue-500 transition-all bg-white">
            </div>
        </div>

        <div id="loadingState" class="text-center py-20">
            <div class="animate-spin h-8 w-8 border-b-2 border-blue-600 mx-auto mb-4 rounded-full"></div>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Syncing Materials...</p>
        </div>

        <div id="tableContainer" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto w-full">
                <table id="materialsTable" class="w-full text-left border-collapse min-w-[600px] sm:min-w-full">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 text-[10px] font-black uppercase tracking-widest">
                        <tr class="header-row">
                            <th id="selectHeader" class="hidden px-3 py-4 w-10 no-print"></th>
                            <th class="px-4 py-4 w-16 cursor-pointer" onclick="handleSort('idNo')">ID</th>
                            <th class="px-4 py-4 cursor-pointer" onclick="handleSort('name')">Material</th>
                            <th class="hidden md:table-cell px-4 py-4 cursor-pointer" onclick="handleSort('brand')">Brand</th>
                            <th class="hidden lg:table-cell px-4 py-4 cursor-pointer" onclick="handleSort('supplier')">Supplier</th>
                            <th class="px-4 py-4 text-right cursor-pointer" onclick="handleSort('price')">Price</th>
                            <th class="admin-only-header hidden px-4 py-4 text-right no-print">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="materialsTableBody" class="divide-y divide-slate-100 text-[11px] sm:text-xs font-medium"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="loginModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-black uppercase">Admin access</h3>
                <button onclick="closeModal('loginModal')" class="text-slate-400 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="event.preventDefault(); submitLogin();">
                <input type="password" id="loginPassword" placeholder="PASSWORD" class="w-full p-3 border border-slate-200 rounded-lg mb-4 uppercase text-xs outline-none focus:border-blue-500">
                <button type="submit" id="loginSubmitBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold uppercase text-xs">Verify</button>
            </form>
        </div>
    </div>

    <!-- Message Edit Modal -->
    <div id="messageModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-black uppercase">Edit Message Board</h3>
                <button onclick="closeModal('messageModal')" class="text-slate-400 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="messageForm" onsubmit="event.preventDefault(); saveBoardMessage();">
                <div class="space-y-4">
                    <div>
                        <label class="text-[9px] font-bold text-slate-400 uppercase">Title</label>
                        <input type="text" id="inputBoardTitle" class="w-full p-2.5 border border-slate-200 rounded-lg uppercase text-xs" placeholder="E.G. PRICE UPDATE">
                    </div>
                    <div>
                        <label class="text-[9px] font-bold text-slate-400 uppercase">Message Content</label>
                        <textarea id="inputBoardContent" rows="3" class="w-full p-2.5 border border-slate-200 rounded-lg uppercase text-xs" placeholder="TYPE MESSAGE HERE..."></textarea>
                    </div>
                    <button type="submit" id="saveBoardBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold uppercase text-xs">Update Board</button>
                </div>
            </form>
        </div>
    </div>

    <div id="itemModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-lg font-black uppercase">Material Details</h3>
                <button onclick="closeModal('itemModal')" class="text-slate-400 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="itemForm" class="space-y-4">
                <input type="hidden" id="itemId">
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">Assigned ID</p>
                    <p id="displayIdNo" class="text-xs font-mono font-bold text-slate-700">NEW</p>
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-400 uppercase ml-1">Description</label>
                    <input type="text" id="itemName" placeholder="ITEM NAME" class="w-full p-2.5 border border-slate-200 rounded-lg uppercase text-xs" required>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="itemBrand" placeholder="BRAND" class="w-full p-2.5 border border-slate-200 rounded-lg uppercase text-xs">
                    <input type="text" id="itemSupplier" placeholder="SUPPLIER" class="w-full p-2.5 border border-slate-200 rounded-lg uppercase text-xs">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" step="0.01" id="itemPrice" placeholder="PRICE" class="w-full p-2.5 border border-slate-200 rounded-lg text-xs" required>
                    <input type="text" id="itemUnit" placeholder="UNIT" class="w-full p-2.5 border border-slate-200 rounded-lg uppercase text-xs" required>
                </div>
                <button type="submit" id="saveBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-black uppercase text-xs shadow-lg shadow-blue-200 active:scale-[0.98] transition-transform mt-2">Save Material</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, getDoc, setDoc, serverTimestamp, query } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDhflO6H-PJFOu4Kk_9nHaly_IJ8wjZpz0",
            authDomain: "dlvpricelist.firebaseapp.com",
            projectId: "dlvpricelist",
            storageBucket: "dlvpricelist.firebasestorage.app",
            messagingSenderId: "1078801309438",
            appId: "1:1078801309438:web:deef9d83586add727ecfaf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'dlv-v1';

        let items = [];
        let selectedIds = new Set();
        let isAdmin = false;
        let isSelectionMode = false;
        let sortConfig = { key: 'idNo', direction: 'asc' }; 
        let searchTimeout;

        const fetchBoardMessage = async () => {
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'messageBoard');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('boardTitle').textContent = data.title || 'Latest Updates';
                    document.getElementById('boardContent').textContent = data.content || 'Welcome to DLV Materials Pricelist.';
                    if (data.updatedAt) {
                        const date = data.updatedAt.toDate();
                        document.getElementById('boardDate').innerHTML = `<i data-lucide="clock" class="w-3.5 h-3.5"></i> <span>Updated: ${date.toLocaleDateString()} ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;
                        lucide.createIcons();
                    }
                }
            } catch (err) { console.error("Error fetching board:", err); }
        };

        window.saveBoardMessage = async () => {
            const btn = document.getElementById('saveBoardBtn');
            btn.disabled = true;
            btn.textContent = "SAVING...";
            try {
                const title = document.getElementById('inputBoardTitle').value.toUpperCase();
                const content = document.getElementById('inputBoardContent').value.toUpperCase();
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'messageBoard'), {
                    title, content, updatedAt: serverTimestamp()
                });
                await fetchBoardMessage();
                closeModal('messageModal');
            } catch (err) { alert(err.message); }
            finally { 
                btn.disabled = false; 
                btn.textContent = "UPDATE BOARD";
            }
        };

        const refreshData = async () => {
            const loadingEl = document.getElementById('loadingState');
            const tableEl = document.getElementById('tableContainer');
            loadingEl.classList.remove('hidden');
            tableEl.classList.add('hidden');
            try {
                fetchBoardMessage();
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'materials'));
                const snap = await getDocs(q);
                items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            } catch (err) { console.error(err); }
            finally { loadingEl.classList.add('hidden'); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) refreshData();
            else signInAnonymously(auth);
        });

        const getNextIdNo = () => {
            const validIds = items.map(i => parseInt(i.idNo)).filter(n => !isNaN(n));
            return validIds.length > 0 ? Math.max(...validIds) + 1 : 1;
        };

        window.openModal = (id, mode = 'add') => {
            const modal = document.getElementById(id);
            modal.classList.add('active');
            if (id === 'itemModal' && mode === 'add') {
                document.getElementById('itemForm').reset();
                document.getElementById('itemId').value = "";
                document.getElementById('displayIdNo').textContent = "NEW ID #" + getNextIdNo();
            } else if (id === 'loginModal') {
                setTimeout(() => document.getElementById('loginPassword').focus(), 300);
            } else if (id === 'messageModal') {
                document.getElementById('inputBoardTitle').value = document.getElementById('boardTitle').textContent;
                document.getElementById('inputBoardContent').value = document.getElementById('boardContent').textContent;
            }
        };

        window.closeModal = (id) => document.getElementById(id).classList.remove('active');

        window.submitLogin = () => {
            const pass = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginSubmitBtn');
            if (pass === 'admin') {
                isAdmin = true;
                document.getElementById('adminControls').classList.remove('hidden');
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('editMessageBtn').classList.remove('hidden');
                closeModal('loginModal');
                document.querySelectorAll('.admin-only-header').forEach(el => el.classList.remove('hidden'));
                setTimeout(() => render(), 100);
            } else {
                btn.classList.add('bg-red-500');
                setTimeout(() => btn.classList.remove('bg-red-500'), 500);
            }
        };

        window.handleExcelUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const json = XLSX.utils.sheet_to_json(worksheet);

                if (confirm(`Import ${json.length} items? This might take a moment.`)) {
                    let nextId = getNextIdNo();
                    for (const row of json) {
                        const material = {
                            idNo: nextId++,
                            name: (row.Material || row.Name || row.description || "").toString().toUpperCase(),
                            brand: (row.Brand || "").toString().toUpperCase(),
                            supplier: (row.Supplier || "").toString().toUpperCase(),
                            price: parseFloat(row.Price || row.price) || 0,
                            unit: (row.Unit || row.unit || "PC").toString().toUpperCase(),
                            updatedAt: serverTimestamp()
                        };
                        if (material.name) {
                            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), material);
                        }
                    }
                    alert("Import completed successfully.");
                    refreshData();
                }
                event.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        };

        window.toggleSelectionMode = () => {
            isSelectionMode = !isSelectionMode;
            document.getElementById('selectionInfo').classList.toggle('hidden', !isSelectionMode);
            document.getElementById('selectHeader').classList.toggle('hidden', !isSelectionMode);
            document.getElementById('selectionLabel').textContent = isSelectionMode ? 'Exit Selection' : 'Selection Mode';
            
            if (!isSelectionMode) {
                selectedIds.clear();
                document.body.classList.remove('selection-active-print');
                document.getElementById('selectedCount').textContent = "0";
            } else {
                document.body.classList.add('selection-active-print');
            }
            render();
        };

        window.toggleRowSelection = (id) => {
            if (!isSelectionMode) return;
            selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
            document.getElementById('selectedCount').textContent = selectedIds.size;
            render();
        };

        window.clearSelection = () => { selectedIds.clear(); document.getElementById('selectedCount').textContent = "0"; render(); };
        
        window.handleSort = (key) => {
            sortConfig.direction = (sortConfig.key === key && sortConfig.direction === 'asc') ? 'desc' : 'asc';
            sortConfig.key = key;
            render();
        };

        window.editItem = (id) => {
            const item = items.find(i => i.id === id);
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemBrand').value = item.brand || '';
            document.getElementById('itemSupplier').value = item.supplier || '';
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemUnit').value = item.unit;
            document.getElementById('displayIdNo').textContent = "ID #" + (item.idNo || 0);
            openModal('itemModal', 'edit');
        };

        const render = () => {
            requestAnimationFrame(() => {
                const term = document.getElementById('searchInput').value.toLowerCase();
                const filtered = items.filter(i => 
                    (i.name || '').toLowerCase().includes(term) || 
                    (i.brand || '').toLowerCase().includes(term) ||
                    (i.idNo || '').toString().includes(term)
                ).sort((a, b) => {
                    let v1 = a[sortConfig.key], v2 = b[sortConfig.key];
                    if (sortConfig.key === 'idNo' || sortConfig.key === 'price') {
                        v1 = parseFloat(v1) || 0;
                        v2 = parseFloat(v2) || 0;
                    } else if (typeof v1 === 'string') { 
                        v1 = v1.toLowerCase(); 
                        v2 = v2.toLowerCase(); 
                    }
                    return sortConfig.direction === 'asc' ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
                });

                const html = filtered.map((i) => `
                    <tr onclick="toggleRowSelection('${i.id}')" class="transition-colors ${selectedIds.has(i.id) ? 'selected-row' : 'hover:bg-slate-50 cursor-pointer'}">
                        <td class="${isSelectionMode ? '' : 'hidden'} px-3 py-4 no-print">
                            <div class="w-5 h-5 border-2 rounded flex items-center justify-center ${selectedIds.has(i.id) ? 'bg-blue-600 border-blue-600' : 'border-slate-300'}">
                                ${selectedIds.has(i.id) ? '<i data-lucide="check" class="w-3 h-3 text-white"></i>' : ''}
                            </div>
                        </td>
                        <td class="px-4 py-4 text-blue-600 font-mono font-black">#${i.idNo}</td>
                        <td class="px-4 py-4">
                            <div class="font-bold text-slate-800 uppercase leading-tight">${i.name}</div>
                            <div class="md:hidden text-[9px] text-slate-400 font-bold uppercase mt-0.5">${i.brand || ''} ${i.brand && i.supplier ? '•' : ''} ${i.supplier || ''}</div>
                        </td>
                        <td class="hidden md:table-cell px-4 py-4 text-slate-500 uppercase font-bold">${i.brand || '-'}</td>
                        <td class="hidden lg:table-cell px-4 py-4 text-slate-500 uppercase font-bold">${i.supplier || '-'}</td>
                        <td class="px-4 py-4">
                            <div class="price-grid">
                                <span class="text-[9px] font-black text-slate-400">₱</span>
                                <span class="price-number font-mono font-black text-blue-700 text-[13px]">${Number(i.price).toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                                <span class="text-[8px] text-slate-400 font-black uppercase">/${i.unit}</span>
                            </div>
                        </td>
                        <td class="admin-only ${isAdmin ? '' : 'hidden'} px-4 py-4 text-right no-print">
                            <div class="flex justify-end gap-2">
                                <button onclick="event.stopPropagation(); editItem('${i.id}')" class="text-slate-400 hover:text-blue-600"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="event.stopPropagation(); deleteItem('${i.id}')" class="text-slate-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </td>
                    </tr>
                `).join('');

                document.getElementById('materialsTableBody').innerHTML = html;
                document.getElementById('tableContainer').classList.remove('hidden');
                lucide.createIcons();
            });
        };

        window.handlePrint = () => { render(); window.print(); };

        document.getElementById('searchInput').oninput = () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(render, 150);
        };

        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            const id = document.getElementById('itemId').value;
            const data = {
                name: document.getElementById('itemName').value.toUpperCase(),
                brand: document.getElementById('itemBrand').value.toUpperCase(),
                supplier: document.getElementById('itemSupplier').value.toUpperCase(),
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                unit: document.getElementById('itemUnit').value.toUpperCase(),
                updatedAt: serverTimestamp()
            };
            try {
                if (id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id), data);
                else { data.idNo = getNextIdNo(); await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), data); }
                refreshData();
                closeModal('itemModal');
            } catch (err) { alert(err.message); }
            finally { saveBtn.disabled = false; }
        });

        window.deleteItem = async (id) => {
            if (!confirm('Delete item?')) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id));
            refreshData();
        };

        window.refreshData = refreshData;
        window.handleLogout = () => location.reload();
        lucide.createIcons();
    </script>
</body>
</html>
