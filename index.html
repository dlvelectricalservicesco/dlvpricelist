<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLV Materials Pricelist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .modal { transition: opacity 0.15s ease-out; opacity: 0; pointer-events: none; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.95); transition: transform 0.15s ease-out; }
        .modal.active .modal-content { transform: scale(1); }
        .selected-row { background-color: #f0f7ff !important; }
        
        /* Layout stability */
        .overflow-x-auto { -webkit-overflow-scrolling: touch; transform: translateZ(0); }
        tr { contain: layout style; height: 57px; }
        
        /* Admin Visibility Logic - CSS based for zero-lag switching */
        body:not(.is-admin) .admin-only { display: none !important; }
        
        .price-grid { display: grid; grid-template-columns: 12px 1fr 35px; align-items: baseline; gap: 1px; width: 100%; max-width: 140px; margin-left: auto; }
        .price-number { text-align: right; font-variant-numeric: tabular-nums; }

        @media print { 
            .no-print { display: none !important; } 
            #tableContainer { box-shadow: none; border: none; width: 100%; display: block !important; } 
            body { background-color: white; } 
            main { padding: 0; max-width: 100%; margin: 0; }
            #messageBoard { border: 1px solid #e2e8f0; color: black !important; background: white !important; box-shadow: none; margin-bottom: 20px; }
            #messageBoard * { color: black !important; }
            
            body.selection-active-print tr:not(.selected-row):not(.header-row) {
                display: none !important;
            }
            .selected-row { background-color: transparent !important; border-bottom: 1px solid #e2e8f0; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen transition-opacity duration-300">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg text-white"><i data-lucide="package" class="w-5 h-5"></i></div>
                <h1 class="text-sm sm:text-lg font-bold uppercase tracking-tight">DLV Materials</h1>
            </div>
            
            <div class="flex items-center gap-1 sm:gap-2">
                <button id="selectionToggle" onclick="toggleSelectionMode()" class="flex items-center gap-1.5 p-2 sm:px-3 sm:py-2 text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200 transition">
                    <i data-lucide="check-square" class="w-4 h-4"></i>
                    <span id="selectionLabel" class="hidden sm:inline uppercase text-[10px] font-black">Select Mode</span>
                </button>
                <button onclick="handlePrint()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200" title="Print List">
                    <i data-lucide="printer" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </button>

                <div id="adminControls" class="admin-only hidden flex items-center gap-1 sm:gap-2 border-l pl-2 ml-1">
                    <button onclick="openModal('itemModal', 'add')" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-[10px] font-bold uppercase hover:bg-blue-700 transition">Add</button>
                    <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-500 transition"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                </div>
                
                <button id="loginBtn" onclick="openModal('loginModal')" class="text-[10px] font-black uppercase text-slate-400 hover:text-blue-600 px-2 no-print">Admin</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 sm:py-6">
        <div id="messageBoard" class="mb-6 bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-4 sm:p-6 shadow-lg text-white relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10 no-print">
                <i data-lucide="megaphone" class="w-20 h-20 rotate-12"></i>
            </div>
            <div class="relative z-10">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-black uppercase tracking-widest bg-white/20 px-2 py-0.5 rounded">Announcement</span>
                    <button id="editMessageBtn" onclick="openModal('messageModal')" class="admin-only hidden bg-white/20 hover:bg-white/30 p-1.5 rounded-lg transition no-print">
                        <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
                <h2 id="boardTitle" class="text-lg sm:text-xl font-black uppercase mb-1">Latest Updates</h2>
                <p id="boardContent" class="text-sm text-blue-50 font-medium leading-relaxed italic">Welcome to DLV Materials Tracker.</p>
                <div id="boardDate" class="mt-4 text-[9px] font-bold uppercase tracking-tighter opacity-70 flex items-center gap-1">
                    <i data-lucide="calendar" class="w-3 h-3"></i>
                    <span id="boardTimestamp">Last updated: --</span>
                </div>
            </div>
        </div>

        <div id="selectionInfo" class="hidden no-print mb-4 p-3 bg-blue-50 border border-blue-100 rounded-xl flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="info" class="w-4 h-4 text-blue-600"></i>
                <p class="text-[10px] text-blue-700 font-bold uppercase"><span id="selectedCount">0</span> items marked for printing</p>
            </div>
            <button onclick="clearSelection()" class="text-[10px] text-blue-600 font-black uppercase hover:underline">Clear</button>
        </div>

        <div class="mb-4 no-print">
            <div class="relative w-full">
                <i data-lucide="search" class="w-4 h-4 absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Search materials..." class="w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-2xl outline-none text-sm uppercase shadow-sm focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all bg-white">
            </div>
        </div>

        <div id="loadingState" class="text-center py-20">
            <div class="animate-spin h-6 w-6 border-2 border-blue-600 border-t-transparent mx-auto mb-4 rounded-full"></div>
            <p class="text-slate-400 text-[9px] font-black uppercase tracking-widest">Fetching Data...</p>
        </div>

        <div id="tableContainer" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto w-full">
                <table id="materialsTable" class="w-full text-left border-collapse min-w-[600px]">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-400 text-[10px] font-black uppercase tracking-widest">
                        <tr class="header-row">
                            <th id="selectHeader" class="hidden px-4 py-4 w-12 no-print"></th>
                            <th class="px-4 py-4 w-20 cursor-pointer hover:text-blue-600" onclick="handleSort('idNo')">ID</th>
                            <th class="px-4 py-4 cursor-pointer hover:text-blue-600" onclick="handleSort('name')">Material</th>
                            <th class="hidden md:table-cell px-4 py-4">Brand</th>
                            <th class="hidden lg:table-cell px-4 py-4">Supplier</th>
                            <th class="px-4 py-4 text-right cursor-pointer hover:text-blue-600" onclick="handleSort('price')">Price</th>
                            <th class="admin-only hidden px-4 py-4 text-right no-print">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="materialsTableBody" class="divide-y divide-slate-100 text-[11px] sm:text-xs font-medium"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="loginModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="modal-content bg-white p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-sm font-black uppercase tracking-widest">Admin Authorization</h3>
                <button onclick="closeModal('loginModal')" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="event.preventDefault(); submitLogin();" class="space-y-4">
                <input type="password" id="loginPassword" placeholder="Enter Access Code" class="w-full p-3.5 border border-slate-200 rounded-xl uppercase text-xs outline-none focus:border-blue-500 bg-slate-50">
                <button type="submit" id="loginSubmitBtn" class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold uppercase text-xs hover:bg-blue-600 transition-colors">Verify</button>
            </form>
        </div>
    </div>

    <div id="messageModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="modal-content bg-white p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-black uppercase">Edit Announcement</h3>
                <button onclick="closeModal('messageModal')" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="event.preventDefault(); saveBoardMessage();" class="space-y-4">
                <input type="text" id="inputBoardTitle" class="w-full p-3 border border-slate-200 rounded-xl uppercase text-xs" placeholder="TITLE">
                <textarea id="inputBoardContent" rows="3" class="w-full p-3 border border-slate-200 rounded-xl uppercase text-xs" placeholder="MESSAGE"></textarea>
                <button type="submit" id="saveBoardBtn" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold uppercase text-xs">Update Board</button>
            </form>
        </div>
    </div>

    <div id="itemModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="modal-content bg-white p-6 rounded-2xl w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-sm font-black uppercase">Material Data Entry</h3>
                <button onclick="closeModal('itemModal')" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="itemForm" class="space-y-4">
                <input type="hidden" id="itemId">
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 text-center">
                    <p id="displayIdNo" class="text-xs font-mono font-black text-blue-600">--</p>
                </div>
                <input type="text" id="itemName" placeholder="ITEM NAME" class="w-full p-3 border border-slate-200 rounded-xl uppercase text-xs" required>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="itemBrand" placeholder="BRAND" class="w-full p-3 border border-slate-200 rounded-xl uppercase text-xs">
                    <input type="text" id="itemSupplier" placeholder="SUPPLIER" class="w-full p-3 border border-slate-200 rounded-xl uppercase text-xs">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" step="0.01" id="itemPrice" placeholder="PRICE" class="w-full p-3 border border-slate-200 rounded-xl text-xs" required>
                    <input type="text" id="itemUnit" placeholder="UNIT (e.g. PC, MTR)" class="w-full p-3 border border-slate-200 rounded-xl uppercase text-xs" required>
                </div>
                <button type="submit" id="saveBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase text-xs shadow-lg shadow-blue-100 hover:bg-blue-700 transition-all">Submit Entry</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, getDoc, setDoc, serverTimestamp, query } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDhflO6H-PJFOu4Kk_9nHaly_IJ8wjZpz0",
            authDomain: "dlvpricelist.firebaseapp.com",
            projectId: "dlvpricelist",
            storageBucket: "dlvpricelist.firebasestorage.app",
            messagingSenderId: "1078801309438",
            appId: "1:1078801309438:web:deef9d83586add727ecfaf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'dlv-v1';

        let items = [];
        let selectedIds = new Set();
        let isAdmin = false;
        let isSelectionMode = false;
        let sortConfig = { key: 'name', direction: 'asc' };
        let renderFrame;

        // Specialized Icon Updater for better performance
        const updateIcons = (container = document) => {
            lucide.createIcons({
                attrs: { class: 'lucide' },
                nameAttr: 'data-lucide'
            });
        };

        const fetchBoardMessage = async () => {
            try {
                const docSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'messageBoard'));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('boardTitle').textContent = data.title || 'Latest Updates';
                    document.getElementById('boardContent').textContent = data.content || 'Welcome to DLV Materials Tracker.';
                    if (data.updatedAt) {
                        const date = data.updatedAt.toDate();
                        document.getElementById('boardTimestamp').textContent = `Last updated: ${date.toLocaleDateString()} ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
                    }
                }
            } catch (err) { console.error(err); }
        };

        window.saveBoardMessage = async () => {
            const btn = document.getElementById('saveBoardBtn');
            btn.disabled = true;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'messageBoard'), {
                    title: document.getElementById('inputBoardTitle').value.toUpperCase(),
                    content: document.getElementById('inputBoardContent').value.toUpperCase(),
                    updatedAt: serverTimestamp()
                });
                await fetchBoardMessage();
                closeModal('messageModal');
            } catch (err) { alert(err.message); }
            finally { btn.disabled = false; }
        };

        const refreshData = async () => {
            const loader = document.getElementById('loadingState');
            const container = document.getElementById('tableContainer');
            loader.classList.remove('hidden');
            container.classList.add('hidden');
            
            try {
                fetchBoardMessage();
                const snap = await getDocs(query(collection(db, 'artifacts', appId, 'public', 'data', 'materials')));
                items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                debouncedRender();
            } catch (err) { console.error(err); }
            finally { loader.classList.add('hidden'); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) refreshData();
            else signInAnonymously(auth);
        });

        window.openModal = (id, mode = 'add') => {
            document.getElementById(id).classList.add('active');
            if (id === 'itemModal' && mode === 'add') {
                document.getElementById('itemForm').reset();
                document.getElementById('itemId').value = "";
                const nextId = items.length > 0 ? Math.max(...items.map(i => parseInt(i.idNo) || 0)) + 1 : 1;
                document.getElementById('displayIdNo').textContent = "SYSTEM ID #" + nextId;
            }
        };

        window.closeModal = (id) => document.getElementById(id).classList.remove('active');

        window.submitLogin = () => {
            if (document.getElementById('loginPassword').value === 'admin') {
                isAdmin = true;
                // Instant CSS switch instead of querySelectorAll loop
                document.body.classList.add('is-admin');
                document.getElementById('loginBtn').classList.add('hidden');
                closeModal('loginModal');
                debouncedRender();
            } else {
                alert("Incorrect access code.");
            }
        };

        window.toggleSelectionMode = () => {
            isSelectionMode = !isSelectionMode;
            document.getElementById('selectionInfo').classList.toggle('hidden', !isSelectionMode);
            document.getElementById('selectHeader').classList.toggle('hidden', !isSelectionMode);
            document.getElementById('selectionLabel').textContent = isSelectionMode ? 'Exit Selection' : 'Select Mode';
            
            if (!isSelectionMode) {
                selectedIds.clear();
                document.body.classList.remove('selection-active-print');
            } else {
                document.body.classList.add('selection-active-print');
            }
            debouncedRender();
        };

        window.toggleRowSelection = (id) => {
            if (!isSelectionMode) return;
            selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
            document.getElementById('selectedCount').textContent = selectedIds.size;
            debouncedRender();
        };

        window.clearSelection = () => { selectedIds.clear(); document.getElementById('selectedCount').textContent = "0"; debouncedRender(); };
        
        window.handleSort = (key) => {
            sortConfig.direction = (sortConfig.key === key && sortConfig.direction === 'asc') ? 'desc' : 'asc';
            sortConfig.key = key;
            debouncedRender();
        };

        window.editItem = (id) => {
            const item = items.find(i => i.id === id);
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemBrand').value = item.brand || '';
            document.getElementById('itemSupplier').value = item.supplier || '';
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemUnit').value = item.unit;
            document.getElementById('displayIdNo').textContent = "EDITING ID #" + (item.idNo || 0);
            openModal('itemModal', 'edit');
        };

        const debouncedRender = () => {
            if (renderFrame) cancelAnimationFrame(renderFrame);
            renderFrame = requestAnimationFrame(render);
        };

        const render = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(i => 
                (i.name || '').toLowerCase().includes(term) || 
                (i.brand || '').toLowerCase().includes(term) ||
                (i.idNo || '').toString().includes(term)
            ).sort((a, b) => {
                let v1 = a[sortConfig.key], v2 = b[sortConfig.key];
                if (v1 === v2) return 0;
                if (typeof v1 === 'string') { v1 = v1.toLowerCase(); v2 = v2.toLowerCase(); }
                return sortConfig.direction === 'asc' ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
            });

            const body = document.getElementById('materialsTableBody');
            let html = '';
            
            for (let i = 0, len = filtered.length; i < len; i++) {
                const item = filtered[i];
                const isSelected = selectedIds.has(item.id);
                
                html += `
                    <tr onclick="toggleRowSelection('${item.id}')" class="transition-colors ${isSelected ? 'selected-row' : 'hover:bg-slate-50 cursor-pointer'}">
                        <td class="${isSelectionMode ? '' : 'hidden'} px-4 py-4 no-print">
                            <div class="w-4 h-4 border rounded flex items-center justify-center ${isSelected ? 'bg-blue-600 border-blue-600' : 'border-slate-300'}">
                                ${isSelected ? '<i data-lucide="check" class="w-3 h-3 text-white"></i>' : ''}
                            </div>
                        </td>
                        <td class="px-4 py-4 text-blue-600 font-mono font-black">#${item.idNo}</td>
                        <td class="px-4 py-4">
                            <div class="font-bold text-slate-800 uppercase leading-tight">${item.name}</div>
                            <div class="md:hidden text-[8px] text-slate-400 font-bold uppercase mt-0.5">${item.brand || ''} ${item.brand && item.supplier ? '•' : ''} ${item.supplier || ''}</div>
                        </td>
                        <td class="hidden md:table-cell px-4 py-4 text-slate-400 uppercase font-bold">${item.brand || '-'}</td>
                        <td class="hidden lg:table-cell px-4 py-4 text-slate-400 uppercase font-bold">${item.supplier || '-'}</td>
                        <td class="px-4 py-4">
                            <div class="price-grid">
                                <span class="text-[9px] font-black text-slate-300">₱</span>
                                <span class="price-number font-mono font-black text-blue-700 text-[13px]">${Number(item.price).toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                                <span class="text-[7px] text-slate-300 font-black uppercase">/${item.unit}</span>
                            </div>
                        </td>
                        <td class="admin-only px-4 py-4 text-right no-print">
                            <div class="flex justify-end gap-3">
                                <button onclick="event.stopPropagation(); editItem('${item.id}')" class="text-slate-300 hover:text-blue-600"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="event.stopPropagation(); deleteItem('${item.id}')" class="text-slate-300 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            }

            body.innerHTML = html;
            document.getElementById('tableContainer').classList.toggle('hidden', items.length === 0);
            updateIcons();
        };

        window.handlePrint = () => {
            render();
            setTimeout(() => window.print(), 100);
        };

        document.getElementById('searchInput').addEventListener('input', () => {
            if (renderFrame) cancelAnimationFrame(renderFrame);
            renderFrame = requestAnimationFrame(render);
        });

        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            const id = document.getElementById('itemId').value;
            const data = {
                name: document.getElementById('itemName').value.toUpperCase(),
                brand: document.getElementById('itemBrand').value.toUpperCase(),
                supplier: document.getElementById('itemSupplier').value.toUpperCase(),
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                unit: document.getElementById('itemUnit').value.toUpperCase(),
                updatedAt: serverTimestamp()
            };
            try {
                if (id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id), data);
                else { 
                    data.idNo = items.length > 0 ? Math.max(...items.map(i => parseInt(i.idNo) || 0)) + 1 : 1;
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), data); 
                }
                refreshData();
                closeModal('itemModal');
            } catch (err) { alert(err.message); }
            finally { btn.disabled = false; }
        });

        window.deleteItem = async (id) => {
            if (confirm('Permanently delete this item?')) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id));
                refreshData();
            }
        };

        window.handleLogout = () => {
            isAdmin = false;
            document.body.classList.remove('is-admin');
            document.getElementById('loginBtn').classList.remove('hidden');
            debouncedRender();
        };

        // Initialize Icons
        updateIcons();
    </script>
</body>
</html>
