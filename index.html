<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLV Materials Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal { transition: opacity 0.3s ease-in-out; opacity: 0; pointer-events: none; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.95); transition: transform 0.3s ease-in-out; }
        .modal.active .modal-content { transform: scale(1); }
        
        .selected-row { background-color: #f0f7ff !important; }

        /* Price alignment utility */
        .price-align {
            display: inline-flex;
            justify-content: flex-end;
            min-width: 100px;
            font-variant-numeric: tabular-nums;
        }

        @media print {
            .no-print { display: none !important; }
            #tableContainer { box-shadow: none; border: none; }
            .print-only-selected tr:not(.selected-row):not(.header-row) { display: none !important; }
            body { background-color: white; }
            main { padding: 0; max-width: 100%; }
            .px-6 { padding-left: 1rem; padding-right: 1rem; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i data-lucide="package" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold uppercase tracking-tight">DLV Materials</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="adminControls" class="hidden flex items-center gap-3">
                    <button id="selectionToggle" onclick="toggleSelectionMode()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200 transition">
                        <i data-lucide="check-square" class="w-4 h-4"></i>
                        <span id="selectionLabel" class="uppercase text-xs">Select Items</span>
                    </button>
                    
                    <button onclick="handlePrint()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200" title="Print List">
                        <i data-lucide="printer" class="w-5 h-5"></i>
                    </button>

                    <button onclick="openModal('itemModal', 'add')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold uppercase hover:bg-blue-700 transition">Add Item</button>
                    
                    <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-500 transition" title="Logout">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
                <button id="loginBtn" onclick="openModal('loginModal')" class="text-xs font-bold uppercase text-slate-600 hover:text-blue-600">Admin Login</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="selectionInfo" class="hidden no-print mb-4 p-3 bg-blue-50 border border-blue-100 rounded-lg flex justify-between items-center">
            <p class="text-xs text-blue-700 font-bold uppercase">
                <span id="selectedCount">0</span> items selected for printing.
            </p>
            <div class="flex gap-4">
                <button onclick="clearSelection()" class="text-xs text-blue-600 font-bold uppercase hover:text-blue-800">Clear Selection</button>
                <button onclick="selectAllVisible()" class="text-xs text-blue-600 font-bold uppercase hover:text-blue-800">Select All Visible</button>
            </div>
        </div>

        <div id="connectionError" class="hidden mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg flex items-center gap-3">
            <i data-lucide="alert-circle" class="w-5 h-5"></i>
            <div>
                <p id="errorMsg" class="font-bold uppercase text-sm">Database connection error.</p>
                <p class="text-[10px] mt-1 uppercase">Check your Firebase Console settings and Security Rules.</p>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 mb-8 no-print">
            <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="SEARCH MATERIALS, BRANDS, OR SUPPLIERS..." class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition text-sm uppercase">
            </div>
        </div>

        <div id="loadingState" class="text-center py-20">
            <div class="animate-spin h-8 w-8 border-b-2 border-blue-600 mx-auto mb-4 rounded-full"></div>
            <p class="text-slate-500 text-xs font-bold uppercase">Syncing database...</p>
        </div>

        <div id="tableContainer" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table id="materialsTable" class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 text-[10px] font-black uppercase tracking-widest">
                        <tr class="header-row">
                            <th id="selectHeader" class="hidden px-4 py-4 w-12 no-print"></th>
                            <th class="px-6 py-4 cursor-pointer hover:bg-slate-100 transition" onclick="handleSort('name')">Material</th>
                            <th class="px-6 py-4 cursor-pointer hover:bg-slate-100 transition" onclick="handleSort('brand')">Brand</th>
                            <th class="px-6 py-4 cursor-pointer hover:bg-slate-100 transition" onclick="handleSort('supplier')">Supplier</th>
                            <th class="px-6 py-4 text-right cursor-pointer hover:bg-slate-100 transition" onclick="handleSort('price')">Price</th>
                            <th class="admin-only hidden px-6 py-4 text-right no-print">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="materialsTableBody" class="divide-y divide-slate-100 text-xs font-medium"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Admin Login Modal -->
    <div id="loginModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-black uppercase">Admin access</h3>
                <button onclick="closeModal('loginModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <input type="password" id="loginPassword" placeholder="PASSWORD" class="w-full p-2.5 border border-slate-200 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 outline-none uppercase text-xs">
            <div id="loginError" class="hidden text-red-500 text-[10px] mb-4 font-bold uppercase">Invalid password</div>
            <button onclick="submitLogin()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold uppercase text-xs hover:bg-blue-700 transition">Login</button>
        </div>
    </div>

    <!-- Item Add/Edit Modal -->
    <div id="itemModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-black uppercase">Material Info</h3>
                <button onclick="closeModal('itemModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="itemForm" class="space-y-4">
                <input type="hidden" id="itemId">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Description</label>
                    <input type="text" id="itemName" class="w-full p-2 border border-slate-200 rounded-lg uppercase text-xs" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Brand</label>
                        <input type="text" id="itemBrand" class="w-full p-2 border border-slate-200 rounded-lg uppercase text-xs">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Supplier</label>
                        <input type="text" id="itemSupplier" class="w-full p-2 border border-slate-200 rounded-lg uppercase text-xs">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Price (₱)</label>
                        <input type="number" step="0.01" id="itemPrice" class="w-full p-2 border border-slate-200 rounded-lg text-xs" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Unit</label>
                        <input type="text" id="itemUnit" placeholder="PC, BOX, KG" class="w-full p-2 border border-slate-200 rounded-lg uppercase text-xs" required>
                    </div>
                </div>
                <div id="saveError" class="hidden p-3 bg-red-50 text-red-600 text-[10px] font-bold uppercase rounded-lg"></div>
                <button type="submit" id="saveBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-black uppercase text-xs">Save Changes</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDhflO6H-PJFOu4Kk_9nHaly_IJ8wjZpz0",
            authDomain: "dlvpricelist.firebaseapp.com",
            projectId: "dlvpricelist",
            storageBucket: "dlvpricelist.firebasestorage.app",
            messagingSenderId: "1078801309438",
            appId: "1:1078801309438:web:deef9d83586add727ecfaf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'dlv-v1';

        let items = [];
        let selectedIds = new Set();
        let isAdmin = false;
        let isSelectionMode = false;
        let sortConfig = { key: 'name', direction: 'asc' };

        window.openModal = (id, mode = 'add') => {
            document.getElementById(id).classList.add('active');
            if (id === 'itemModal' && mode === 'add') {
                document.getElementById('itemForm').reset();
                document.getElementById('itemId').value = "";
                document.getElementById('modalTitle').textContent = "Add Material";
            }
        };

        window.closeModal = (id) => document.getElementById(id).classList.remove('active');

        window.submitLogin = () => {
            if (document.getElementById('loginPassword').value === 'admin') {
                isAdmin = true;
                document.getElementById('adminControls').classList.remove('hidden');
                document.getElementById('loginBtn').classList.add('hidden');
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                closeModal('loginModal');
                render();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        };

        window.handleLogout = () => location.reload();

        window.toggleSelectionMode = () => {
            isSelectionMode = !isSelectionMode;
            document.getElementById('selectionLabel').textContent = isSelectionMode ? "Exit Selection" : "Select Items";
            document.getElementById('selectionInfo').classList.toggle('hidden', !isSelectionMode);
            document.getElementById('selectHeader').classList.toggle('hidden', !isSelectionMode);
            document.getElementById('selectionToggle').classList.toggle('bg-blue-600', isSelectionMode);
            document.getElementById('selectionToggle').classList.toggle('text-white', isSelectionMode);
            if (!isSelectionMode) clearSelection();
            render();
        };

        window.toggleRowSelection = (id) => {
            if (!isSelectionMode) return;
            selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
            document.getElementById('selectedCount').textContent = selectedIds.size;
            render();
        };

        window.clearSelection = () => {
            selectedIds.clear();
            document.getElementById('selectedCount').textContent = "0";
            render();
        };

        window.selectAllVisible = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            items.filter(i => (i.name||'').toLowerCase().includes(term)).forEach(i => selectedIds.add(i.id));
            document.getElementById('selectedCount').textContent = selectedIds.size;
            render();
        };

        window.handlePrint = () => {
            const table = document.getElementById('materialsTable');
            selectedIds.size > 0 ? table.classList.add('print-only-selected') : table.classList.remove('print-only-selected');
            window.print();
        };

        window.handleSort = (key) => {
            sortConfig.direction = (sortConfig.key === key && sortConfig.direction === 'asc') ? 'desc' : 'asc';
            sortConfig.key = key;
            render();
        };

        window.editItem = (id) => {
            const item = items.find(i => i.id === id);
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemBrand').value = item.brand || '';
            document.getElementById('itemSupplier').value = item.supplier || '';
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemUnit').value = item.unit;
            document.getElementById('modalTitle').textContent = "Edit Material";
            openModal('itemModal', 'edit');
        };

        window.deleteItem = async (id) => {
            if (confirm('DELETE THIS MATERIAL?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id));
        };

        const render = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(i => 
                (i.name || '').toLowerCase().includes(term) || 
                (i.brand || '').toLowerCase().includes(term) ||
                (i.supplier || '').toLowerCase().includes(term)
            ).sort((a, b) => {
                let v1 = a[sortConfig.key], v2 = b[sortConfig.key];
                if (typeof v1 === 'string') { v1 = v1.toLowerCase(); v2 = v2.toLowerCase(); }
                return sortConfig.direction === 'asc' ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
            });

            document.getElementById('materialsTableBody').innerHTML = filtered.map(i => `
                <tr onclick="toggleRowSelection('${i.id}')" class="group transition-colors ${selectedIds.has(i.id) ? 'selected-row' : 'hover:bg-slate-50'} ${isSelectionMode ? 'cursor-pointer' : ''}">
                    <td class="${isSelectionMode ? '' : 'hidden'} px-4 py-4 no-print">
                        <div class="w-5 h-5 border-2 rounded flex items-center justify-center ${selectedIds.has(i.id) ? 'bg-blue-600 border-blue-600' : 'border-slate-300'}">
                            ${selectedIds.has(i.id) ? '<i data-lucide="check" class="w-3 h-3 text-white"></i>' : ''}
                        </div>
                    </td>
                    <td class="px-6 py-4 font-bold text-slate-800 uppercase tracking-tight">${i.name}</td>
                    <td class="px-6 py-4 text-slate-500 uppercase text-[10px] font-bold">${i.brand || '-'}</td>
                    <td class="px-6 py-4 text-slate-500 uppercase text-[10px] font-bold">${i.supplier || '-'}</td>
                    <td class="px-6 py-4 text-right">
                        <div class="inline-flex items-baseline gap-1">
                            <span class="text-[10px] font-black text-slate-400">₱</span>
                            <span class="price-align font-mono font-black text-blue-700 text-sm">
                                ${Number(i.price).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                            </span>
                            <span class="text-[8px] text-slate-400 font-black uppercase">/${i.unit}</span>
                        </div>
                    </td>
                    <td class="admin-only ${isAdmin ? '' : 'hidden'} px-6 py-4 text-right no-print">
                        <div class="flex justify-end gap-1 ${isSelectionMode ? 'opacity-0' : 'opacity-0 group-hover:opacity-100'} transition">
                            <button onclick="event.stopPropagation(); editItem('${i.id}')" class="text-slate-400 hover:text-blue-600 p-1.5 rounded-lg hover:bg-blue-100">
                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                            </button>
                            <button onclick="event.stopPropagation(); deleteItem('${i.id}')" class="text-slate-400 hover:text-red-600 p-1.5 rounded-lg hover:bg-red-100">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
            
            document.getElementById('tableContainer').classList.remove('hidden');
            document.getElementById('loadingState').classList.add('hidden');
            lucide.createIcons();
        };

        const start = async () => {
            try {
                await signInAnonymously(auth);
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), (snap) => {
                    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    render();
                });
            } catch (e) { console.error(e); }
        };
        start();

        document.getElementById('itemForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('itemId').value;
            const data = {
                name: document.getElementById('itemName').value,
                brand: document.getElementById('itemBrand').value,
                supplier: document.getElementById('itemSupplier').value,
                price: parseFloat(document.getElementById('itemPrice').value),
                unit: document.getElementById('itemUnit').value,
                updatedAt: serverTimestamp()
            };
            try {
                id ? await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id), data) 
                   : await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), data);
                closeModal('itemModal');
            } catch (err) { alert(err.message); }
        };

        document.getElementById('searchInput').oninput = render;
        lucide.createIcons();
    </script>
</body>
</html>
