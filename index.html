<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLV Materials Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal { transition: opacity 0.3s ease-in-out; opacity: 0; pointer-events: none; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.95); transition: transform 0.3s ease-in-out; }
        .modal.active .modal-content { transform: scale(1); }
        @media print {
            .no-print { display: none !important; }
            #tableContainer { box-shadow: none; border: none; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i data-lucide="package" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold">DLV Materials</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="window.print()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg" title="Print List">
                    <i data-lucide="printer" class="w-5 h-5"></i>
                </button>
                <div id="adminControls" class="hidden flex items-center gap-2">
                    <button onclick="openModal('itemModal', 'add')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">Add Item</button>
                    <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-500 transition" title="Logout">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
                <button id="loginBtn" onclick="openModal('loginModal')" class="text-sm font-medium text-slate-600 hover:text-blue-600">Admin Login</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Connection Warning -->
        <div id="connectionError" class="hidden mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg flex items-center gap-3">
            <i data-lucide="alert-circle" class="w-5 h-5"></i>
            <div>
                <p id="errorMsg" class="font-bold">Database connection error.</p>
                <p class="text-xs mt-1">Check your Firebase Console settings and Security Rules.</p>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 mb-8 no-print">
            <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Search materials or brands..." class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
        </div>

        <div id="loadingState" class="text-center py-20">
            <div class="animate-spin h-8 w-8 border-b-2 border-blue-600 mx-auto mb-4 rounded-full"></div>
            <p class="text-slate-500">Syncing with database...</p>
        </div>

        <div id="tableContainer" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm uppercase tracking-wider">
                        <tr>
                            <th class="px-6 py-4 font-semibold cursor-pointer hover:bg-slate-100 transition" onclick="handleSort('name')">Item Name</th>
                            <th class="px-6 py-4 font-semibold cursor-pointer hover:bg-slate-100 transition" onclick="handleSort('brand')">Brand</th>
                            <th class="px-6 py-4 font-semibold cursor-pointer hover:bg-slate-100 transition" onclick="handleSort('supplier')">Supplier</th>
                            <th class="px-6 py-4 text-right font-semibold cursor-pointer hover:bg-slate-100 transition" onclick="handleSort('price')">Price</th>
                            <th class="admin-only hidden px-6 py-4 text-right no-print">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="materialsTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Admin Login Modal -->
    <div id="loginModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Admin access</h3>
                <button onclick="closeModal('loginModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-slate-500 text-sm mb-4">Enter the administrative password to manage items.</p>
            <input type="password" id="loginPassword" placeholder="Password" class="w-full p-2.5 border border-slate-200 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
            <div id="loginError" class="hidden text-red-500 text-xs mb-4 flex items-center gap-1">
                <i data-lucide="alert-circle" class="w-3 h-3"></i> Invalid password
            </div>
            <button onclick="submitLogin()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">Unlock Features</button>
        </div>
    </div>

    <!-- Item Add/Edit Modal -->
    <div id="itemModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-bold">Item Details</h3>
                <button onclick="closeModal('itemModal')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="itemForm" class="space-y-4">
                <input type="hidden" id="itemId">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Material Description</label>
                    <input type="text" id="itemName" placeholder="e.g. 1/2' Marine Plywood" class="w-full p-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Brand</label>
                        <input type="text" id="itemBrand" placeholder="Brand name" class="w-full p-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Supplier</label>
                        <input type="text" id="itemSupplier" placeholder="Store name" class="w-full p-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Price (₱)</label>
                        <input type="number" step="0.01" id="itemPrice" placeholder="0.00" class="w-full p-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Unit</label>
                        <input type="text" id="itemUnit" placeholder="pc, kg, box" class="w-full p-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                </div>
                <div id="saveError" class="hidden p-3 bg-red-50 text-red-600 text-xs rounded-lg border border-red-100"></div>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeModal('itemModal')" class="flex-1 py-2.5 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition">Cancel</button>
                    <button type="submit" id="saveBtn" class="flex-[2] bg-blue-600 text-white py-2.5 rounded-lg font-bold hover:bg-blue-700 transition shadow-md shadow-blue-200">Save Material</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyDhflO6H-PJFOu4Kk_9nHaly_IJ8wjZpz0",
            authDomain: "dlvpricelist.firebaseapp.com",
            projectId: "dlvpricelist",
            storageBucket: "dlvpricelist.firebasestorage.app",
            messagingSenderId: "1078801309438",
            appId: "1:1078801309438:web:deef9d83586add727ecfaf",
            measurementId: "G-WTSDX7D9TJ"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'dlv-v1';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let items = [];
        let isAdmin = false;
        let sortConfig = { key: 'name', direction: 'asc' };

        function showError(msg) {
            const errDiv = document.getElementById('connectionError');
            errDiv.classList.remove('hidden');
            document.getElementById('errorMsg').textContent = msg;
            document.getElementById('loadingState').classList.add('hidden');
        }

        // --- Modals ---
        window.openModal = (id, mode = 'add') => {
            const modal = document.getElementById(id);
            modal.classList.add('active');
            if (id === 'itemModal') {
                document.getElementById('saveError').classList.add('hidden');
                if (mode === 'add') {
                    document.getElementById('modalTitle').textContent = "Add New Material";
                    document.getElementById('itemForm').reset();
                    document.getElementById('itemId').value = "";
                } else {
                    document.getElementById('modalTitle').textContent = "Edit Material";
                }
                setTimeout(() => document.getElementById('itemName').focus(), 150);
            } else if (id === 'loginModal') {
                document.getElementById('loginPassword').value = "";
                setTimeout(() => document.getElementById('loginPassword').focus(), 150);
            }
        };

        window.closeModal = (id) => document.getElementById(id).classList.remove('active');

        // --- Authentication ---
        window.submitLogin = () => {
            const pass = document.getElementById('loginPassword').value;
            if (pass === 'admin') {
                isAdmin = true;
                document.getElementById('adminControls').classList.remove('hidden');
                document.getElementById('loginBtn').classList.add('hidden');
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                closeModal('loginModal');
                render();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        };

        window.handleLogout = () => { location.reload(); };

        // --- Sorting ---
        window.handleSort = (key) => {
            sortConfig.direction = (sortConfig.key === key && sortConfig.direction === 'asc') ? 'desc' : 'asc';
            sortConfig.key = key;
            render();
        };

        // --- Actions ---
        window.editItem = (id) => {
            const item = items.find(i => i.id === id);
            if (!item) return;
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name || '';
            document.getElementById('itemBrand').value = item.brand || '';
            document.getElementById('itemSupplier').value = item.supplier || '';
            document.getElementById('itemPrice').value = item.price || 0;
            document.getElementById('itemUnit').value = item.unit || '';
            openModal('itemModal', 'edit');
        };

        window.deleteItem = async (id) => {
            if (confirm('Delete this material permanently?') && db) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id));
                } catch (e) { 
                    alert("Delete failed. Check Firestore rules.");
                }
            }
        };

        const render = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(i => 
                (i.name || '').toLowerCase().includes(term) || 
                (i.brand || '').toLowerCase().includes(term) ||
                (i.supplier || '').toLowerCase().includes(term)
            );
            
            filtered.sort((a, b) => {
                let v1 = a[sortConfig.key], v2 = b[sortConfig.key];
                if (typeof v1 === 'string') { v1 = v1.toLowerCase(); v2 = v2.toLowerCase(); }
                return sortConfig.direction === 'asc' ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
            });

            const body = document.getElementById('materialsTableBody');
            if (filtered.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-400">No matching materials found.</td></tr>`;
            } else {
                body.innerHTML = filtered.map(i => `
                    <tr class="group hover:bg-blue-50/30 transition-colors">
                        <td class="px-6 py-4 font-semibold text-slate-900">${i.name}</td>
                        <td class="px-6 py-4 text-slate-500">${i.brand || '<span class="text-slate-300 italic">No brand</span>'}</td>
                        <td class="px-6 py-4 text-slate-500">${i.supplier || '-'}</td>
                        <td class="px-6 py-4 text-right font-mono text-blue-700 font-bold whitespace-nowrap">
                            ₱${Number(i.price).toLocaleString(undefined, {minimumFractionDigits: 2})}
                            <span class="text-[10px] text-slate-400 font-medium uppercase ml-1">/${i.unit || 'pc'}</span>
                        </td>
                        <td class="admin-only ${isAdmin ? '' : 'hidden'} px-6 py-4 text-right no-print">
                            <div class="flex justify-end gap-1 opacity-0 group-hover:opacity-100 transition">
                                <button onclick="editItem('${i.id}')" class="text-slate-400 hover:text-blue-600 p-1.5 rounded-lg hover:bg-blue-100 transition">
                                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteItem('${i.id}')" class="text-slate-400 hover:text-red-600 p-1.5 rounded-lg hover:bg-red-100 transition">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
                lucide.createIcons();
            }
            document.getElementById('tableContainer').classList.remove('hidden');
            document.getElementById('loadingState').classList.add('hidden');
        };

        // --- Firestore Initialization ---
        const start = async () => {
            try {
                await signInAnonymously(auth);
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), (snap) => {
                    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    render();
                }, (err) => {
                    console.error("Firestore Error:", err);
                    showError("Database connection failed. Please update your Firestore Rules.");
                });
            } catch (e) {
                showError("Connection failed: " + e.message);
            }
        };
        start();

        // --- Event Listeners ---
        document.getElementById('itemForm').onsubmit = async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            const errorEl = document.getElementById('saveError');
            
            saveBtn.disabled = true;
            saveBtn.innerHTML = `<span class="inline-block animate-spin mr-2">↻</span> Saving...`;
            errorEl.classList.add('hidden');

            const id = document.getElementById('itemId').value;
            const data = {
                name: document.getElementById('itemName').value,
                brand: document.getElementById('itemBrand').value,
                supplier: document.getElementById('itemSupplier').value,
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                unit: document.getElementById('itemUnit').value || 'pc',
                updatedAt: serverTimestamp()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id), data);
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), data);
                }
                closeModal('itemModal');
            } catch (err) { 
                errorEl.textContent = "Failed to save: " + (err.code === 'permission-denied' ? "Security Rules block writing." : err.message);
                errorEl.classList.remove('hidden');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "Save Material";
            }
        };

        // Enter key listeners
        document.getElementById('loginPassword').onkeydown = (e) => {
            if (e.key === 'Enter') submitLogin();
        };

        document.getElementById('searchInput').oninput = render;
        lucide.createIcons();
    </script>
</body>
</html>
