<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLV Materials Pricelist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .modal { transition: opacity 0.2s ease-in-out; opacity: 0; pointer-events: none; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.98); transition: transform 0.2s ease-in-out; }
        .modal.active .modal-content { transform: scale(1); }
        .selected-row { background-color: #f0f7ff !important; }
        
        .price-grid { display: grid; grid-template-columns: 12px 1fr 35px; align-items: baseline; gap: 1px; width: 100%; max-width: 140px; margin-left: auto; }
        .price-number { text-align: right; font-variant-numeric: tabular-nums; }

        @keyframes highlight-fade {
            0% { background-color: #fef08a; transform: scale(1.02); }
            100% { background-color: transparent; transform: scale(1); }
        }
        .item-highlight { animation: highlight-fade 2.5s ease-out forwards; z-index: 10; position: relative; }

        .log-scroll { max-height: 420px; overflow-y: auto; }
        .log-scroll::-webkit-scrollbar { width: 4px; }
        .log-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .error-shake { animation: shake 0.2s ease-in-out 0s 2; }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }
        .shine-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-25deg);
            animation: shine 6s infinite ease-in-out;
        }

        @media print { 
            .no-print { display: none !important; } 
            body.selection-active-print tr:not(.selected-row):not(.header-row) { display: none !important; }
            .selected-row { background-color: white !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-1.5 rounded-lg text-white"><i data-lucide="package" class="w-5 h-5"></i></div>
                <h1 class="text-sm sm:text-lg font-bold uppercase tracking-tight">DLV Materials Pricelist</h1>
            </div>
            
            <div class="flex items-center gap-1 sm:gap-3">
                <button onclick="refreshData()" class="p-2 text-slate-500 hover:text-blue-600 transition" title="Refresh Data">
                    <i data-lucide="refresh-cw" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </button>
                <button id="selectionToggle" onclick="toggleSelectionMode()" class="p-2 sm:px-3 sm:py-2 text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200 transition">
                    <i data-lucide="check-square" class="w-4 h-4 sm:hidden"></i>
                    <span id="selectionLabel" class="hidden sm:inline uppercase text-[10px] font-black">Selection Mode</span>
                </button>

                <div id="adminControls" class="hidden flex items-center gap-1 sm:gap-3 border-l border-slate-200 pl-2 sm:pl-3">
                    <button onclick="openModal('logsModal')" class="p-2 text-slate-500 hover:text-blue-600 transition" title="View History">
                        <i data-lucide="history" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                    </button>
                    <input type="file" id="excelInput" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
                    <button onclick="document.getElementById('excelInput').click()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200 transition">
                        <i data-lucide="file-up" class="w-4 h-4"></i>
                    </button>
                    <button onclick="openModal('itemModal', 'add')" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-blue-700 transition">Add</button>
                    <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-500 transition"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                </div>
                <button id="loginBtn" onclick="openModal('loginModal')" class="text-[10px] font-black uppercase text-slate-400 hover:text-blue-600 px-2 transition-colors">Admin</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 sm:py-8">
        <!-- Message Board -->
        <div id="messageBoard" class="mb-6 bg-gradient-to-br from-indigo-600 via-blue-600 to-blue-700 rounded-2xl p-5 sm:p-7 shadow-xl text-white relative overflow-hidden shine-effect">
            <div class="relative z-10">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-black uppercase tracking-widest bg-yellow-500 text-blue-900 px-2.5 py-1 rounded-full shadow-sm">Updates</span>
                    </div>
                    <button id="editMessageBtn" onclick="openMessageModal()" class="hidden bg-white/20 hover:bg-white/30 p-2 rounded-xl transition no-print backdrop-blur-md">
                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                    </button>
                </div>
                <h2 id="boardTitle" class="text-xl sm:text-2xl font-black uppercase mb-2 tracking-tight">Latest Updates</h2>
                <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/10">
                    <p id="boardContent" class="text-sm font-semibold whitespace-pre-wrap leading-relaxed">Loading message...</p>
                </div>
            </div>
        </div>

        <div id="selectionInfo" class="hidden no-print mb-4 p-3 bg-blue-50 border border-blue-100 rounded-lg flex justify-between items-center">
            <div class="flex items-center gap-3">
                <p class="text-[10px] text-blue-700 font-bold uppercase"><span id="selectedCount">0</span> items selected</p>
                <div id="adminBulkActions" class="hidden flex gap-2 border-l border-blue-200 pl-3">
                    <button onclick="bulkDelete()" class="text-[10px] text-red-600 font-black uppercase hover:underline">Delete Selected</button>
                </div>
            </div>
            <button onclick="clearSelection()" class="text-[10px] text-blue-600 font-black uppercase">Clear Selection</button>
        </div>

        <div class="mb-4 no-print flex gap-2">
            <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="SEARCH MATERIALS OR #ID..." class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl outline-none text-sm uppercase shadow-sm focus:border-blue-500 transition-all bg-white">
            </div>
            <button onclick="handlePrint()" class="px-4 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition">
                <i data-lucide="printer" class="w-4 h-4 text-slate-600"></i>
            </button>
        </div>

        <div id="loadingState" class="text-center py-20">
            <div class="animate-spin h-8 w-8 border-b-2 border-blue-600 mx-auto mb-4 rounded-full"></div>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Syncing...</p>
        </div>

        <div id="tableContainer" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto w-full">
                <table id="materialsTable" class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 text-[10px] font-black uppercase tracking-widest">
                        <tr class="header-row">
                            <th id="selectHeader" class="hidden px-3 py-4 w-10 no-print"></th>
                            <th class="px-4 py-4 w-16 cursor-pointer" onclick="handleSort('idNo')">ID</th>
                            <th class="px-4 py-4 cursor-pointer" onclick="handleSort('name')">Material</th>
                            <th class="hidden md:table-cell px-4 py-4">Brand</th>
                            <th class="px-4 py-4 text-right cursor-pointer" onclick="handleSort('price')">Price</th>
                            <th class="admin-only-header hidden px-4 py-4 text-right no-print">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="materialsTableBody" class="divide-y divide-slate-100 text-[11px] sm:text-xs font-medium"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Activity Logs Modal -->
    <div id="logsModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="modal-content bg-white rounded-2xl w-full max-w-lg shadow-2xl flex flex-col max-h-[80vh]">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-600 p-1.5 rounded-lg text-white"><i data-lucide="history" class="w-4 h-4"></i></div>
                    <h3 class="text-sm font-black uppercase tracking-tight">Admin Activity Logs</h3>
                </div>
                <button onclick="closeModal('logsModal')" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="logsList" class="p-4 log-scroll flex-1 space-y-3 bg-white"></div>
            <div class="p-4 bg-slate-50 border-t border-slate-100 text-center">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Showing recent 50 activities • Scroll for more</p>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div id="loginContent" class="modal-content bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-black uppercase mb-4 text-center">Admin access</h3>
            <div id="loginError" class="hidden mb-4 p-3 bg-red-50 border border-red-100 rounded-lg flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 text-red-500"></i>
                <p class="text-[10px] font-black uppercase text-red-600">Incorrect Password</p>
            </div>
            <form onsubmit="event.preventDefault(); submitLogin();">
                <input type="password" id="loginPassword" placeholder="PASSWORD" class="w-full p-3 border border-slate-200 rounded-lg mb-4 text-xs outline-none focus:border-blue-500">
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold uppercase text-xs">Verify</button>
            </form>
            <button onclick="closeModal('loginModal')" class="w-full mt-2 text-[10px] font-black uppercase text-slate-400 py-2">Cancel</button>
        </div>
    </div>

    <!-- Confirmation Modal (Generic) -->
    <div id="confirmModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl text-center">
            <div id="confirmIcon" class="mx-auto w-12 h-12 rounded-full flex items-center justify-center mb-4"></div>
            <h3 id="confirmTitle" class="text-sm font-black uppercase mb-2"></h3>
            <p id="confirmText" class="text-xs text-slate-500 mb-6 font-medium"></p>
            <div class="flex gap-2">
                <button id="confirmCancel" class="flex-1 py-3 text-[10px] font-black uppercase text-slate-400 hover:bg-slate-50 rounded-lg">Cancel</button>
                <button id="confirmProceed" class="flex-1 py-3 text-[10px] font-black uppercase text-white rounded-lg"></button>
            </div>
        </div>
    </div>

    <div id="messageModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-sm">
            <h3 class="text-lg font-black uppercase mb-4">Edit Board</h3>
            <form onsubmit="event.preventDefault(); saveBoardMessage();" class="space-y-4">
                <input type="text" id="inputBoardTitle" class="w-full p-2.5 border border-slate-200 rounded-lg text-xs uppercase" placeholder="TITLE">
                <textarea id="inputBoardContent" rows="5" class="w-full p-2.5 border border-slate-200 rounded-lg text-xs uppercase" placeholder="MESSAGE (USE ENTER FOR NEW LINES)"></textarea>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold uppercase text-xs">Update Board</button>
            </form>
        </div>
    </div>

    <div id="itemModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-md shadow-2xl">
            <h3 id="modalTitle" class="text-lg font-black uppercase mb-6">Material Details</h3>
            <form id="itemForm" class="space-y-4">
                <input type="hidden" id="itemId">
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <p id="displayIdNo" class="text-xs font-mono font-bold text-slate-700">NEW</p>
                </div>
                <input type="text" id="itemName" placeholder="ITEM NAME" class="w-full p-2.5 border border-slate-200 rounded-lg uppercase text-xs" required>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="itemBrand" placeholder="BRAND" class="w-full p-2.5 border border-slate-200 rounded-lg uppercase text-xs">
                    <input type="text" id="itemSupplier" placeholder="SUPPLIER" class="w-full p-2.5 border border-slate-200 rounded-lg uppercase text-xs">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" step="0.01" id="itemPrice" placeholder="PRICE" class="w-full p-2.5 border border-slate-200 rounded-lg text-xs" required>
                    <input type="text" id="itemUnit" placeholder="UNIT" class="w-full p-2.5 border border-slate-200 rounded-lg uppercase text-xs" required>
                </div>
                <button type="submit" id="saveBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-black uppercase text-xs">Save Material</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, getDoc, setDoc, serverTimestamp, query, orderBy, limit, writeBatch } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDhflO6H-PJFOu4Kk_9nHaly_IJ8wjZpz0",
            authDomain: "dlvpricelist.firebaseapp.com",
            projectId: "dlvpricelist",
            storageBucket: "dlvpricelist.firebasestorage.app",
            messagingSenderId: "1078801309438",
            appId: "1:1078801309438:web:deef9d83586add727ecfaf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'dlv-v1';

        let items = [];
        let logs = [];
        let selectedIds = new Set();
        let isAdmin = false;
        let isSelectionMode = false;
        let sortConfig = { key: 'idNo', direction: 'asc' }; 

        const createLog = async (action, itemName, itemId, idNo) => {
            if (!isAdmin) return;
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'logs'), {
                    action, itemName, itemId: itemId || '', idNo: idNo || '', timestamp: serverTimestamp()
                });
            } catch (err) { console.error("Log error:", err); }
        };

        const showConfirm = (title, text, type, proceedLabel, onProceed) => {
            const modal = document.getElementById('confirmModal');
            const icon = document.getElementById('confirmIcon');
            const proceedBtn = document.getElementById('confirmProceed');
            
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmText').textContent = text;
            proceedBtn.textContent = proceedLabel;
            
            icon.className = `mx-auto w-12 h-12 rounded-full flex items-center justify-center mb-4 ${type === 'danger' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`;
            icon.innerHTML = `<i data-lucide="${type === 'danger' ? 'alert-triangle' : 'info'}" class="w-6 h-6"></i>`;
            proceedBtn.className = `flex-1 py-3 text-[10px] font-black uppercase text-white rounded-lg ${type === 'danger' ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`;
            
            modal.classList.add('active');
            lucide.createIcons();

            const cancel = () => {
                modal.classList.remove('active');
                document.getElementById('confirmProceed').onclick = null;
            };
            
            document.getElementById('confirmCancel').onclick = cancel;
            proceedBtn.onclick = () => {
                onProceed();
                cancel();
            };
        };

        const fetchLogs = async () => {
            if (!isAdmin) return;
            try {
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'logs'));
                const snap = await getDocs(q);
                logs = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                          .sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0))
                          .slice(0, 50);
                renderLogs();
            } catch (err) { console.error("Fetch logs error:", err); }
        };

        const renderLogs = () => {
            const container = document.getElementById('logsList');
            if (logs.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-[10px] font-bold uppercase">No records yet</div>`;
                return;
            }
            container.innerHTML = logs.map(log => {
                const date = log.timestamp ? new Date(log.timestamp.seconds * 1000).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : 'Just now';
                let colorClass = log.action === 'ADD' ? 'bg-green-100 text-green-700' : log.action === 'EDIT' ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700';
                return `
                    <div ${log.action !== 'DELETE' ? `onclick="navigateToItem('${log.idNo}')"` : ''} 
                         class="p-3 bg-white border border-slate-100 rounded-xl flex items-center justify-between group ${log.action !== 'DELETE' ? 'cursor-pointer hover:border-blue-200 hover:shadow-md' : 'opacity-80'} transition-all">
                        <div class="flex items-center gap-3">
                            <span class="text-[8px] font-black px-2 py-0.5 rounded ${colorClass}">${log.action}</span>
                            <div>
                                <p class="text-[10px] font-black uppercase text-slate-800 leading-tight">${log.itemName}</p>
                                <p class="text-[9px] font-bold text-slate-400 mt-0.5 uppercase">ID: #${log.idNo || '??'}</p>
                            </div>
                        </div>
                        <div class="text-right flex items-center gap-2">
                            <p class="text-[8px] font-bold text-slate-400 uppercase">${date}</p>
                            ${log.action !== 'DELETE' ? `<i data-lucide="chevron-right" class="w-3 h-3 text-slate-300 group-hover:text-blue-500 transition-colors"></i>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        };

        window.navigateToItem = (idNo) => {
            closeModal('logsModal');
            document.getElementById('searchInput').value = idNo;
            render();
            setTimeout(() => {
                const rows = document.querySelectorAll('#materialsTableBody tr');
                for (let row of rows) {
                    if (row.innerText.includes(`#${idNo}`)) {
                        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        row.classList.add('item-highlight');
                        setTimeout(() => row.classList.remove('item-highlight'), 3000);
                        break;
                    }
                }
            }, 300);
        };

        const fetchBoardMessage = async () => {
            const docSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'messageBoard'));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('boardTitle').textContent = data.title;
                document.getElementById('boardContent').textContent = data.content;
                document.getElementById('inputBoardTitle').value = data.title;
                document.getElementById('inputBoardContent').value = data.content;
            }
        };

        window.openMessageModal = () => isAdmin && openModal('messageModal');

        window.saveBoardMessage = async () => {
            const title = document.getElementById('inputBoardTitle').value.toUpperCase();
            const content = document.getElementById('inputBoardContent').value.toUpperCase();
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'messageBoard'), {
                title, content, updatedAt: serverTimestamp()
            });
            fetchBoardMessage();
            closeModal('messageModal');
            createLog('EDIT', `BOARD: ${title}`, 'board', 'MSG');
        };

        const refreshData = async () => {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('tableContainer').classList.add('hidden');
            try {
                fetchBoardMessage();
                if (isAdmin) fetchLogs();
                const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'materials'));
                items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            } catch (err) { console.error(err); }
            finally { document.getElementById('loadingState').classList.add('hidden'); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) refreshData(); else signInAnonymously(auth);
        });

        window.openModal = (id, mode = 'add') => {
            const modal = document.getElementById(id);
            modal.classList.add('active');
            if (id === 'loginModal') {
                document.getElementById('loginError').classList.add('hidden');
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginContent').classList.remove('error-shake');
            }
            if (id === 'itemModal' && mode === 'add') {
                document.getElementById('itemForm').reset();
                document.getElementById('itemId').value = "";
                const nextId = items.length > 0 ? Math.max(...items.map(i => parseInt(i.idNo) || 0)) + 1 : 1;
                document.getElementById('displayIdNo').textContent = "NEW ID #" + nextId;
            }
        };

        window.closeModal = (id) => document.getElementById(id).classList.remove('active');

        window.submitLogin = () => {
            const passwordInput = document.getElementById('loginPassword');
            const errorBanner = document.getElementById('loginError');
            const loginContent = document.getElementById('loginContent');

            if (passwordInput.value === 'admin') {
                isAdmin = true;
                document.getElementById('adminControls').classList.remove('hidden');
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('editMessageBtn').classList.remove('hidden');
                document.querySelectorAll('.admin-only-header').forEach(el => el.classList.remove('hidden'));
                if (isSelectionMode) document.getElementById('adminBulkActions').classList.remove('hidden');
                closeModal('loginModal');
                render();
                fetchLogs();
            } else {
                errorBanner.classList.remove('hidden');
                loginContent.classList.remove('error-shake');
                void loginContent.offsetWidth;
                loginContent.classList.add('error-shake');
                passwordInput.value = '';
                passwordInput.focus();
            }
        };

        window.toggleSelectionMode = () => {
            isSelectionMode = !isSelectionMode;
            document.getElementById('selectionLabel').textContent = isSelectionMode ? 'Cancel Selection' : 'Selection Mode';
            document.getElementById('selectionInfo').classList.toggle('hidden', !isSelectionMode);
            document.getElementById('selectHeader').classList.toggle('hidden', !isSelectionMode);
            document.getElementById('adminBulkActions').classList.toggle('hidden', !(isSelectionMode && isAdmin));
            if (!isSelectionMode) {
                selectedIds.clear();
                document.body.classList.remove('selection-active-print');
            } else {
                document.body.classList.add('selection-active-print');
            }
            render();
        };

        window.clearSelection = () => {
            selectedIds.clear();
            document.getElementById('selectedCount').textContent = '0';
            render();
        };

        window.toggleRowSelection = (id) => {
            if (!isSelectionMode) return;
            selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
            document.getElementById('selectedCount').textContent = selectedIds.size;
            render();
        };

        window.bulkDelete = () => {
            if (selectedIds.size === 0) return;
            showConfirm(
                'Bulk Delete', 
                `Are you sure you want to delete ${selectedIds.size} selected items? This action cannot be undone.`, 
                'danger', 
                'Delete All', 
                async () => {
                    const batch = writeBatch(db);
                    const deletedNames = [];
                    selectedIds.forEach(id => {
                        const item = items.find(i => i.id === id);
                        if (item) {
                            deletedNames.push(item.name);
                            batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id));
                        }
                    });
                    await batch.commit();
                    createLog('DELETE', `BULK DELETE: ${deletedNames.length} ITEMS`, '', '');
                    selectedIds.clear();
                    refreshData();
                }
            );
        };

        window.handleSort = (key) => {
            sortConfig.direction = (sortConfig.key === key && sortConfig.direction === 'asc') ? 'desc' : 'asc';
            sortConfig.key = key;
            render();
        };

        const render = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(i => 
                (i.name || '').toLowerCase().includes(term) || 
                (i.idNo || '').toString().includes(term)
            ).sort((a, b) => {
                let v1 = a[sortConfig.key], v2 = b[sortConfig.key];
                if (sortConfig.key === 'idNo' || sortConfig.key === 'price') { v1 = parseFloat(v1) || 0; v2 = parseFloat(v2) || 0; }
                return sortConfig.direction === 'asc' ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
            });

            document.getElementById('materialsTableBody').innerHTML = filtered.map(i => `
                <tr onclick="toggleRowSelection('${i.id}')" class="${selectedIds.has(i.id) ? 'selected-row' : 'hover:bg-slate-50'} transition-all cursor-pointer">
                    <td class="${isSelectionMode ? '' : 'hidden'} px-3 py-4">
                        <div class="w-4 h-4 border rounded ${selectedIds.has(i.id) ? 'bg-blue-600 border-blue-600' : 'border-slate-300'}"></div>
                    </td>
                    <td class="px-4 py-4 text-blue-600 font-mono font-black">#${i.idNo}</td>
                    <td class="px-4 py-4 font-bold uppercase">${i.name}</td>
                    <td class="hidden md:table-cell px-4 py-4 text-slate-400 font-bold uppercase">${i.brand || '-'}</td>
                    <td class="px-4 py-4 text-right">
                        <div class="price-grid">
                            <span class="text-[8px] font-black text-slate-300">₱</span>
                            <span class="price-number font-black text-blue-700">${Number(i.price).toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                            <span class="text-[7px] text-slate-300 uppercase">/${i.unit}</span>
                        </div>
                    </td>
                    <td class="${isAdmin ? '' : 'hidden'} px-4 py-4 text-right no-print">
                        <div class="flex justify-end gap-2">
                            <button onclick="event.stopPropagation(); editItem('${i.id}')" class="text-slate-300 hover:text-blue-600"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="event.stopPropagation(); deleteItem('${i.id}')" class="text-slate-300 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
            document.getElementById('tableContainer').classList.remove('hidden');
            lucide.createIcons();
        };

        window.editItem = (id) => {
            const item = items.find(i => i.id === id);
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemBrand').value = item.brand || '';
            document.getElementById('itemSupplier').value = item.supplier || '';
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemUnit').value = item.unit;
            document.getElementById('displayIdNo').textContent = "ID #" + item.idNo;
            openModal('itemModal', 'edit');
        };

        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('itemId').value;
            const data = {
                name: document.getElementById('itemName').value.toUpperCase(),
                brand: document.getElementById('itemBrand').value.toUpperCase(),
                supplier: document.getElementById('itemSupplier').value.toUpperCase(),
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                unit: document.getElementById('itemUnit').value.toUpperCase(),
                updatedAt: serverTimestamp()
            };
            if (id) {
                const old = items.find(i => i.id === id);
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id), data);
                createLog('EDIT', data.name, id, old.idNo);
            } else {
                data.idNo = items.length > 0 ? Math.max(...items.map(i => parseInt(i.idNo) || 0)) + 1 : 1;
                const newDoc = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), data);
                createLog('ADD', data.name, newDoc.id, data.idNo);
            }
            refreshData();
            closeModal('itemModal');
        });

        window.deleteItem = async (id) => {
            const item = items.find(i => i.id === id);
            showConfirm(
                'Delete Item', 
                `Delete "${item.name}" permanently?`, 
                'danger', 
                'Delete', 
                async () => {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id));
                    createLog('DELETE', item.name, id, item.idNo);
                    refreshData();
                }
            );
        };

        window.handleExcelUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (evt) => {
                try {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const wsname = wb.SheetNames[0];
                    const ws = wb.Sheets[wsname];
                    const rawData = XLSX.utils.sheet_to_json(ws);
                    
                    const validItems = rawData.filter(row => {
                        const name = (row.Material || row.name || row.ITEM || row.MaterialName || '').toString().trim();
                        const price = parseFloat(row.Price || row.price || row.PRICE || row.Cost || 0);
                        return name && !isNaN(price);
                    });

                    if (validItems.length > 0) {
                        showConfirm(
                            'Excel Upload', 
                            `Found ${validItems.length} valid items in this file. Proceed to upload all?`, 
                            'info', 
                            'Upload All', 
                            async () => {
                                document.getElementById('loadingState').classList.remove('hidden');
                                let nextIdNo = items.length > 0 ? Math.max(...items.map(i => parseInt(i.idNo) || 0)) + 1 : 1;
                                for (const row of validItems) {
                                    const material = {
                                        idNo: nextIdNo++,
                                        name: (row.Material || row.name || row.ITEM || row.MaterialName || '').toString().trim().toUpperCase(),
                                        price: parseFloat(row.Price || row.price || row.PRICE || row.Cost || 0),
                                        unit: (row.Unit || row.unit || row.UNIT || 'PC').toString().trim().toUpperCase(),
                                        brand: (row.Brand || row.brand || row.BRAND || '').toString().trim().toUpperCase(),
                                        supplier: (row.Supplier || row.supplier || row.SUPPLIER || '').toString().trim().toUpperCase(),
                                        updatedAt: serverTimestamp()
                                    };
                                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), material);
                                }
                                createLog('ADD', `EXCEL IMPORT (${validItems.length} ITEMS)`, '', '');
                                refreshData();
                            }
                        );
                    } else {
                        alert("No valid items found. Check column headers: Material, Price, Unit.");
                    }
                } catch (err) {
                    console.error("Excel processing error:", err);
                    alert("Error processing file.");
                }
                e.target.value = '';
            };
            reader.readAsBinaryString(file);
        };

        document.getElementById('searchInput').oninput = render;

        window.handlePrint = () => {
            if (isSelectionMode && selectedIds.size === 0) {
                alert("Selection mode is active but no items are selected.");
                return;
            }
            window.print();
        };

        window.handleLogout = () => location.reload();
        window.refreshData = refreshData;
        lucide.createIcons();
    </script>
</body>
</html>
