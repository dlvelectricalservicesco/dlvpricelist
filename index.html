<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLV Materials Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal { transition: opacity 0.3s ease-in-out; opacity: 0; pointer-events: none; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.95); transition: transform 0.3s ease-in-out; }
        .modal.active .modal-content { transform: scale(1); }
        @media print {
            .no-print { display: none !important; }
            #tableContainer { box-shadow: none; border: none; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i data-lucide="package" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold">DLV Materials</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="window.print()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                    <i data-lucide="printer" class="w-5 h-5"></i>
                </button>
                <div id="adminControls" class="hidden flex items-center gap-2">
                    <button onclick="openModal('itemModal', 'add')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Add Item</button>
                    <button onclick="handleLogout()" class="p-2 text-slate-400"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                </div>
                <button id="loginBtn" onclick="openModal('loginModal')" class="text-sm font-medium text-slate-600">Admin Login</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex gap-4 mb-8 no-print">
            <input type="text" id="searchInput" placeholder="Search materials..." class="flex-1 p-2 border rounded-lg">
            <select id="supplierFilter" class="p-2 border rounded-lg bg-white"><option value="All">All Suppliers</option></select>
        </div>

        <div id="loadingState" class="text-center py-20"><div class="animate-spin h-8 w-8 border-b-2 border-blue-600 mx-auto"></div></div>

        <div id="tableContainer" class="hidden bg-white rounded-xl shadow-sm border overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b">
                    <tr>
                        <th class="px-6 py-4 cursor-pointer" onclick="handleSort('name')">Item Name</th>
                        <th class="px-6 py-4 cursor-pointer" onclick="handleSort('brand')">Brand</th>
                        <th class="px-6 py-4 cursor-pointer" onclick="handleSort('supplier')">Supplier</th>
                        <th class="px-6 py-4 text-right cursor-pointer" onclick="handleSort('price')">Price</th>
                        <th class="admin-only hidden px-6 py-4 text-right no-print">Actions</th>
                    </tr>
                </thead>
                <tbody id="materialsTableBody" class="divide-y"></tbody>
            </table>
        </div>
    </main>

    <!-- Modals -->
    <div id="loginModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-black/50">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-sm">
            <h3 class="text-lg font-bold mb-4">Admin Login</h3>
            <input type="password" id="loginPassword" placeholder="Password" class="w-full p-2 border rounded mb-4">
            <button onclick="submitLogin()" class="w-full bg-blue-600 text-white py-2 rounded">Login</button>
            <button onclick="closeModal('loginModal')" class="w-full mt-2 text-slate-500 text-sm">Cancel</button>
        </div>
    </div>

    <div id="itemModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-black/50">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-md">
            <h3 id="modalTitle" class="text-lg font-bold mb-4">Item Details</h3>
            <form id="itemForm" class="space-y-3">
                <input type="hidden" id="itemId">
                <input type="text" id="itemName" placeholder="Item Name" class="w-full p-2 border rounded" required>
                <input type="text" id="itemBrand" placeholder="Brand" class="w-full p-2 border rounded">
                <input type="text" id="itemSupplier" placeholder="Supplier" class="w-full p-2 border rounded">
                <div class="flex gap-2">
                    <input type="number" step="0.01" id="itemPrice" placeholder="Price" class="flex-1 p-2 border rounded" required>
                    <input type="text" id="itemUnit" placeholder="Unit" class="w-32 p-2 border rounded">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded">Save</button>
                <button type="button" onclick="closeModal('itemModal')" class="w-full text-slate-500">Cancel</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // Firebase Setup with safety checks
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const app = firebaseConfig ? initializeApp(firebaseConfig) : null;
        const auth = app ? getAuth(app) : null;
        const db = app ? getFirestore(app) : null;

        let items = [];
        let isAdmin = false;
        let sortConfig = { key: 'name', direction: 'asc' };

        // Global functions
        window.openModal = (id, mode = 'add') => {
            document.getElementById(id).classList.add('active');
            if (id === 'itemModal' && mode === 'add') document.getElementById('itemForm').reset();
        };
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');

        window.submitLogin = () => {
            if (document.getElementById('loginPassword').value === 'admin') {
                isAdmin = true;
                document.getElementById('adminControls').classList.remove('hidden');
                document.getElementById('loginBtn').classList.add('hidden');
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                closeModal('loginModal');
                render();
            }
        };

        window.handleLogout = () => { location.reload(); };

        window.handleSort = (key) => {
            sortConfig.direction = (sortConfig.key === key && sortConfig.direction === 'asc') ? 'desc' : 'asc';
            sortConfig.key = key;
            render();
        };

        window.editItem = (id) => {
            const item = items.find(i => i.id === id);
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemBrand').value = item.brand;
            document.getElementById('itemSupplier').value = item.supplier;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemUnit').value = item.unit;
            openModal('itemModal', 'edit');
        };

        window.deleteItem = async (id) => {
            if (confirm('Delete this item?') && db) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id));
                } catch (e) { console.error("Delete failed", e); }
            }
        };

        const render = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(i => (i.name || '').toLowerCase().includes(term) || (i.brand || '').toLowerCase().includes(term));
            
            filtered.sort((a, b) => {
                let v1 = a[sortConfig.key], v2 = b[sortConfig.key];
                if (typeof v1 === 'string') { v1 = v1.toLowerCase(); v2 = v2.toLowerCase(); }
                return sortConfig.direction === 'asc' ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
            });

            document.getElementById('materialsTableBody').innerHTML = filtered.map(i => `
                <tr class="hover:bg-slate-50">
                    <td class="px-6 py-4 font-medium">${i.name}</td>
                    <td class="px-6 py-4 text-slate-500">${i.brand || '-'}</td>
                    <td class="px-6 py-4 text-slate-500">${i.supplier || '-'}</td>
                    <td class="px-6 py-4 text-right font-mono">₱${Number(i.price).toLocaleString()} <span class="text-xs text-slate-400">/${i.unit || 'pc'}</span></td>
                    <td class="admin-only ${isAdmin ? '' : 'hidden'} px-6 py-4 text-right no-print">
                        <button onclick="editItem('${i.id}')" class="text-blue-600 mr-2">Edit</button>
                        <button onclick="deleteItem('${i.id}')" class="text-red-600">Delete</button>
                    </td>
                </tr>
            `).join('');
            document.getElementById('tableContainer').classList.remove('hidden');
            document.getElementById('loadingState').classList.add('hidden');
        };

        // Auth & Data listeners - Added check for db existence
        if (auth && db) {
            const start = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    // Double check db is valid before calling collection()
                    if (db) {
                        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), (snap) => {
                            items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                            render();
                        }, (err) => {
                            console.error("Snapshot error:", err);
                            document.getElementById('loadingState').textContent = "Connection error. Please refresh.";
                        });
                    }
                } catch (e) {
                    console.error("Initialization failed", e);
                    document.getElementById('loadingState').textContent = "Failed to connect to database.";
                }
            };
            start();
        } else {
            document.getElementById('loadingState').textContent = "Database configuration missing.";
        }

        document.getElementById('itemForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!db) return;
            const id = document.getElementById('itemId').value;
            const data = {
                name: document.getElementById('itemName').value,
                brand: document.getElementById('itemBrand').value,
                supplier: document.getElementById('itemSupplier').value,
                price: parseFloat(document.getElementById('itemPrice').value),
                unit: document.getElementById('itemUnit').value,
                updatedAt: serverTimestamp()
            };
            try {
                if (id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id), data);
                else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), data);
                closeModal('itemModal');
            } catch (err) { console.error("Save failed", err); }
        };

        document.getElementById('searchInput').oninput = render;
        lucide.createIcons();
    </script>
</body>
</html>
