<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLV Materials Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal { transition: opacity 0.3s ease-in-out; opacity: 0; pointer-events: none; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.95); transition: transform 0.3s ease-in-out; }
        .modal.active .modal-content { transform: scale(1); }
        .selected-row { background-color: #f0f7ff !important; }
        .price-grid { display: grid; grid-template-columns: 14px 1fr 40px; align-items: baseline; gap: 2px; width: 160px; margin-left: auto; }
        .price-number { text-align: right; font-variant-numeric: tabular-nums; }
        @media print { 
            .no-print { display: none !important; } 
            #tableContainer { box-shadow: none; border: none; } 
            .print-only-selected tr:not(.selected-row):not(.header-row) { display: none !important; } 
            body { background-color: white; } 
            main { padding: 0; max-width: 100%; } 
            .px-6 { padding-left: 1rem; padding-right: 1rem; } 
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-2 rounded-lg text-white"><i data-lucide="package" class="w-6 h-6"></i></div>
                <h1 class="text-xl font-bold uppercase tracking-tight">DLV Materials</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="refreshData()" class="p-2 text-slate-500 hover:text-blue-600 transition" title="Refresh Data">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
                <div id="adminControls" class="hidden flex items-center gap-3">
                    <input type="file" id="excelInput" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
                    
                    <button onclick="document.getElementById('excelInput').click()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200 transition">
                        <i data-lucide="file-up" class="w-4 h-4"></i><span class="uppercase text-xs">Import Excel</span>
                    </button>

                    <button id="selectionToggle" onclick="toggleSelectionMode()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200 transition">
                        <i data-lucide="check-square" class="w-4 h-4"></i><span id="selectionLabel" class="uppercase text-xs">Select Items</span>
                    </button>
                    
                    <button onclick="handlePrint()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg border border-slate-200" title="Print List"><i data-lucide="printer" class="w-5 h-5"></i></button>
                    <button onclick="openModal('itemModal', 'add')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold uppercase hover:bg-blue-700 transition">Add Item</button>
                    <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-500 transition"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                </div>
                <button id="loginBtn" onclick="openModal('loginModal')" class="text-xs font-bold uppercase text-slate-600 hover:text-blue-600">Admin Login</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="importStatus" class="hidden no-print mb-4 p-3 bg-green-50 border border-green-100 rounded-lg flex justify-between items-center">
            <p id="importMessage" class="text-xs text-green-700 font-bold uppercase"></p>
            <button onclick="this.parentElement.classList.add('hidden')" class="text-xs text-green-600 font-bold uppercase">Dismiss</button>
        </div>

        <div id="selectionInfo" class="hidden no-print mb-4 p-3 bg-blue-50 border border-blue-100 rounded-lg flex justify-between items-center">
            <p class="text-xs text-blue-700 font-bold uppercase"><span id="selectedCount">0</span> items selected.</p>
            <div class="flex gap-4">
                <button onclick="clearSelection()" class="text-xs text-blue-600 font-bold uppercase">Clear</button>
                <button onclick="selectAllVisible()" class="text-xs text-blue-600 font-bold uppercase">Select All</button>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 mb-8 no-print">
            <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="SEARCH MATERIALS..." class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg outline-none text-sm uppercase">
            </div>
        </div>

        <div id="loadingState" class="text-center py-20">
            <div class="animate-spin h-8 w-8 border-b-2 border-blue-600 mx-auto mb-4 rounded-full"></div>
            <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Fetching Data...</p>
        </div>

        <div id="tableContainer" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <table id="materialsTable" class="w-full text-left border-collapse">
                <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 text-[10px] font-black uppercase tracking-widest">
                    <tr class="header-row">
                        <th id="selectHeader" class="hidden px-4 py-4 w-12 no-print"></th>
                        <th class="px-6 py-4 cursor-pointer" onclick="handleSort('name')">Material</th>
                        <th class="px-6 py-4 cursor-pointer" onclick="handleSort('brand')">Brand</th>
                        <th class="px-6 py-4 cursor-pointer" onclick="handleSort('supplier')">Supplier</th>
                        <th class="px-6 py-4 text-right cursor-pointer" onclick="handleSort('price')">Price</th>
                        <th class="admin-only hidden px-6 py-4 text-right no-print">Actions</th>
                    </tr>
                </thead>
                <tbody id="materialsTableBody" class="divide-y divide-slate-100 text-xs font-medium"></tbody>
            </table>
        </div>
    </main>

    <div id="loginModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-black uppercase">Admin access</h3>
                <button onclick="closeModal('loginModal')" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="event.preventDefault(); submitLogin();">
                <input type="password" id="loginPassword" placeholder="PASSWORD" class="w-full p-2.5 border border-slate-200 rounded-lg mb-4 uppercase text-xs">
                <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold uppercase text-xs">Login</button>
            </form>
        </div>
    </div>

    <div id="itemModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
        <div class="modal-content bg-white p-6 rounded-xl w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-black uppercase">Material Info</h3>
                <button onclick="closeModal('itemModal')" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="itemForm" class="space-y-4">
                <input type="hidden" id="itemId">
                <input type="text" id="itemName" placeholder="DESCRIPTION" class="w-full p-2 border border-slate-200 rounded-lg uppercase text-xs" required>
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="itemBrand" placeholder="BRAND" class="w-full p-2 border border-slate-200 rounded-lg uppercase text-xs">
                    <input type="text" id="itemSupplier" placeholder="SUPPLIER" class="w-full p-2 border border-slate-200 rounded-lg uppercase text-xs">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" step="0.01" id="itemPrice" placeholder="PRICE" class="w-full p-2 border border-slate-200 rounded-lg text-xs" required>
                    <input type="text" id="itemUnit" placeholder="UNIT (e.g. PC)" class="w-full p-2 border border-slate-200 rounded-lg uppercase text-xs" required>
                </div>
                <button type="submit" id="saveBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-black uppercase text-xs">Save Changes</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, serverTimestamp, query, orderBy } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDhflO6H-PJFOu4Kk_9nHaly_IJ8wjZpz0",
            authDomain: "dlvpricelist.firebaseapp.com",
            projectId: "dlvpricelist",
            storageBucket: "dlvpricelist.firebasestorage.app",
            messagingSenderId: "1078801309438",
            appId: "1:1078801309438:web:deef9d83586add727ecfaf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'dlv-v1';

        let items = [];
        let selectedIds = new Set();
        let isAdmin = false;
        let isSelectionMode = false;
        let sortConfig = { key: 'name', direction: 'asc' };

        const refreshData = async () => {
            const loadingEl = document.getElementById('loadingState');
            const tableEl = document.getElementById('tableContainer');
            loadingEl.classList.remove('hidden');
            tableEl.classList.add('hidden');
            try {
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'materials'));
                const snap = await getDocs(q);
                items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            } catch (err) { console.error("Fetch error:", err); }
            finally { loadingEl.classList.add('hidden'); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) refreshData();
            else signInAnonymously(auth);
        });

        // --- IMPROVED EXCEL UPLOAD LOGIC ---
        window.handleExcelUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);
                
                if (jsonData.length === 0) {
                    alert("Walang laman ang Excel file!");
                    return;
                }

                if (confirm(`I-import ang ${jsonData.length} items mula sa Excel?`)) {
                    document.getElementById('loadingState').classList.remove('hidden');
                    let successCount = 0;
                    
                    for (const row of jsonData) {
                        try {
                            // Mas matalinong pagkuha ng presyo
                            let rawPrice = row.price || row.Price || row.PRICE || row.Cost || 0;
                            // Tanggalin ang currency symbols at commas para hindi maging NaN
                            let cleanPrice = typeof rawPrice === 'string' 
                                ? parseFloat(rawPrice.replace(/[^0-9.-]+/g, "")) 
                                : parseFloat(rawPrice);
                            
                            const materialData = {
                                name: (row.name || row.Name || row.Material || row.DESCRIPTION || "").toString().toUpperCase(),
                                brand: (row.brand || row.Brand || row.BRAND || "").toString().toUpperCase(),
                                supplier: (row.supplier || row.Supplier || row.SUPPLIER || "").toString().toUpperCase(),
                                price: isNaN(cleanPrice) ? 0 : cleanPrice,
                                unit: (row.unit || row.Unit || row.UNIT || "PC").toString().toUpperCase(),
                                updatedAt: serverTimestamp()
                            };

                            if (materialData.name) {
                                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), materialData);
                                successCount++;
                            }
                        } catch (err) { console.error("Row import error:", err); }
                    }

                    document.getElementById('importMessage').textContent = `SUCCESS: ${successCount} ITEMS IMPORTED.`;
                    document.getElementById('importStatus').classList.remove('hidden');
                    refreshData();
                }
                event.target.value = "";
            };
            reader.readAsArrayBuffer(file);
        };

        window.openModal = (id, mode = 'add') => {
            document.getElementById(id).classList.add('active');
            if (id === 'itemModal' && mode === 'add') {
                document.getElementById('itemForm').reset();
                document.getElementById('itemId').value = "";
            }
        };

        window.closeModal = (id) => document.getElementById(id).classList.remove('active');

        window.submitLogin = () => {
            if (document.getElementById('loginPassword').value === 'admin') {
                isAdmin = true;
                document.getElementById('adminControls').classList.remove('hidden');
                document.getElementById('loginBtn').classList.add('hidden');
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                closeModal('loginModal');
                render();
            }
        };

        window.handleLogout = () => location.reload();

        window.toggleSelectionMode = () => {
            isSelectionMode = !isSelectionMode;
            document.getElementById('selectionLabel').textContent = isSelectionMode ? "Exit Selection" : "Select Items";
            document.getElementById('selectionInfo').classList.toggle('hidden', !isSelectionMode);
            document.getElementById('selectHeader').classList.toggle('hidden', !isSelectionMode);
            if (!isSelectionMode) selectedIds.clear();
            render();
        };

        window.toggleRowSelection = (id) => {
            if (!isSelectionMode) return;
            selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
            document.getElementById('selectedCount').textContent = selectedIds.size;
            render();
        };

        window.clearSelection = () => {
            selectedIds.clear();
            document.getElementById('selectedCount').textContent = "0";
            render();
        };

        window.selectAllVisible = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            items.filter(i => 
                (i.name || '').toLowerCase().includes(term) || 
                (i.brand || '').toLowerCase().includes(term)
            ).forEach(i => selectedIds.add(i.id));
            document.getElementById('selectedCount').textContent = selectedIds.size;
            render();
        };

        window.handlePrint = () => {
            const table = document.getElementById('materialsTable');
            if (selectedIds.size > 0) table.classList.add('print-only-selected');
            else table.classList.remove('print-only-selected');
            window.print();
        };

        window.handleSort = (key) => {
            sortConfig.direction = (sortConfig.key === key && sortConfig.direction === 'asc') ? 'desc' : 'asc';
            sortConfig.key = key;
            render();
        };

        window.editItem = (id) => {
            const item = items.find(i => i.id === id);
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemBrand').value = item.brand || '';
            document.getElementById('itemSupplier').value = item.supplier || '';
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemUnit').value = item.unit;
            openModal('itemModal', 'edit');
        };

        window.deleteItem = async (id) => {
            if (!confirm('Delete this item?')) return;
            items = items.filter(i => i.id !== id);
            render();
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id));
        };

        const render = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(i => 
                (i.name || '').toLowerCase().includes(term) || 
                (i.brand || '').toLowerCase().includes(term)
            ).sort((a, b) => {
                let v1 = a[sortConfig.key], v2 = b[sortConfig.key];
                if (typeof v1 === 'string') { v1 = v1.toLowerCase(); v2 = v2.toLowerCase(); }
                return sortConfig.direction === 'asc' ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
            });

            document.getElementById('materialsTableBody').innerHTML = filtered.map(i => `
                <tr onclick="toggleRowSelection('${i.id}')" class="group transition-colors ${selectedIds.has(i.id) ? 'selected-row' : 'hover:bg-slate-50'} ${isSelectionMode ? 'cursor-pointer' : ''}">
                    <td class="${isSelectionMode ? '' : 'hidden'} px-4 py-4 no-print">
                        <div class="w-5 h-5 border-2 rounded flex items-center justify-center ${selectedIds.has(i.id) ? 'bg-blue-600 border-blue-600' : 'border-slate-300'}">
                            ${selectedIds.has(i.id) ? '<i data-lucide="check" class="w-3 h-3 text-white"></i>' : ''}
                        </div>
                    </td>
                    <td class="px-6 py-4 font-bold text-slate-800 uppercase tracking-tight">${i.name}</td>
                    <td class="px-6 py-4 text-slate-500 uppercase text-[10px] font-bold">${i.brand || '-'}</td>
                    <td class="px-6 py-4 text-slate-500 uppercase text-[10px] font-bold">${i.supplier || '-'}</td>
                    <td class="px-6 py-4">
                        <div class="price-grid">
                            <span class="text-[10px] font-black text-slate-400">₱</span>
                            <span class="price-number font-mono font-black text-blue-700 text-sm">${Number(i.price).toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                            <span class="text-[8px] text-slate-400 font-black uppercase">/${i.unit}</span>
                        </div>
                    </td>
                    <td class="admin-only ${isAdmin ? '' : 'hidden'} px-6 py-4 text-right no-print">
                        <div class="flex justify-end gap-1 opacity-0 group-hover:opacity-100 transition">
                            <button onclick="event.stopPropagation(); editItem('${i.id}')" class="text-slate-400 hover:text-blue-600 p-1.5"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="event.stopPropagation(); deleteItem('${i.id}')" class="text-slate-400 hover:text-red-600 p-1.5"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
            document.getElementById('tableContainer').classList.remove('hidden');
            lucide.createIcons();
        };

        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            const id = document.getElementById('itemId').value;
            const data = {
                name: document.getElementById('itemName').value,
                brand: document.getElementById('itemBrand').value,
                supplier: document.getElementById('itemSupplier').value,
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                unit: document.getElementById('itemUnit').value,
                updatedAt: serverTimestamp()
            };
            try {
                if (id) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id), data);
                    const idx = items.findIndex(i => i.id === id);
                    items[idx] = { ...items[idx], ...data };
                } else {
                    const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), data);
                    items.push({ id: docRef.id, ...data });
                }
                render();
                closeModal('itemModal');
            } catch (err) { alert(err.message); }
            finally { saveBtn.disabled = false; }
        });

        document.getElementById('searchInput').oninput = render;
        window.refreshData = refreshData;
        lucide.createIcons();
    </script>
</body>
</html>
